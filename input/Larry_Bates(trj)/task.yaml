  - Financial commitments at or above $300 require his explicit approval; routine approved brewery supplies below that threshold proceed with judgment.
  - Distributor contact, competition entries, regulatory filings, and any communication carrying the brewery's voice require his confirmation before send.
  - All travel bookings regardless of cost require his confirmation.

