  ## MEMORY.md

  # Memory: Larry Bates

  ## Personal Profile

  Larry is the third generation of a brewing family in the southern Appalachian mountains. The Bates family has been in these mountains for four generations and brewing for three. He moves through a day with the steadiness of someone whose work is governed by processes that take weeks rather than minutes. The calm is what twenty years of mash rest, fermentation crawl, and barrel age settle into. He is decisive when needed and slow when he can afford to be, does not change recipes on impulse, and is loyal in ways that occasionally cost him commercially.

  **Education**: B.Sc. Fermentation Science, Oregon State University, 2009. Apprenticed under his father, Thomas, for six years before assuming head brewer in 2015. Siebel Institute advanced brewing technology, 2014.

  **Languages**: English (native), German (conversational, improving for export markets), basic French from a 2018 Quebec craft exchange.

  **Citizenship**: U.S. citizen, born in Asheville. Lived in Corvallis through university.

  **Cultural identity**: Appalachian by inheritance and conviction. Soft Western North Carolina accent. Family is Protestant in the loose Appalachian way; church attendance more cultural than devotional. The brewhouse is closer to his sacred space than any church.

  **Philosophy**: Believes beer is a conversation with grain, and that brewing is stewardship rather than manufacturing. Believes in continuity over disruption and thinks about the next generation more than quarter-to-quarter results. Honours inherited tradition by adding to it carefully rather than copying it exactly.

  ## Key Relationships

  - **Sarah Bates (née Harper)**: Age 37, wife, married 10 years. Former graphic designer, now runs the brewery's branding, label artwork, and marketing materials. From Hendersonville, NC. Practical, creative, true partner in life and business. Larry shows love through small steady actions; Sarah has taught him to give words occasionally.
  - **Hana Bates**: Age 7, daughter, second grade at Asheville Municipal Elementary. Cheerful, curious, loves the brewery. Saturday morning walks with Larry are protected.
  - **Thomas Bates**: Age 68, father, retired head brewer, former owner. Handed the brewery to Larry in 2020 and remains a respected advisor. Lives in a separate wing of the family compound. Knee problems and mild hearing loss.
  - **Margaret Bates**: Age 66, mother. Manages the household and helps with brewery hospitality (tours, tastings). Warm and traditional. Worries about Larry's health during brewing season.
  - **Greg Holloway**: Age 45, head brewer assistant, fifteen years at Bates Brewing Company. Expert grain specialist. Reliable, quiet, indispensable. Larry trusts him completely with the brewhouse.
  - **Dave Caldwell**: Age 52, primary barley farmer. Grows specialty malting barley on 200 acres specifically for Bates Brewing Company. Third-generation farming family. The grain relationship is a forty-year partnership predating Larry.
  - **Erin Whitfield**: Age 42, primary distributor contact at Blue Ridge Distribution. Ten-year professional relationship. Understands the brand positioning and fights for shelf space. Quarterly meetings.
  - **Dr. Ryan Prescott**: Age 50, researcher at Asheville Fermentation Science Laboratory. Technical advisor on yeast strains and fermentation optimisation. Collaborative: Larry provides production data, Prescott provides scientific support.
  - **Jake Moreland**: Age 36, close friend and fellow brewer. Runs a small brewery in Hendersonville. Trained alongside Larry under their respective fathers. Monthly dinners at the Farmhouse Tavern are their most honest professional conversations.
  - **Dr. Karen Albright**: Age 50, family doctor at Asheville Family Clinic. Sees Larry, Sarah, and Hana. Annual checkups and seasonal health management.

  ## Work & Projects

  **Role**: Head brewer and owner of Bates Brewing Company. Responsible for every brewing decision: recipe design, grain selection, mash management, fermentation management, conditioning, blending. Also runs business operations: distribution, finances, marketing (with Sarah), regulatory compliance, brewery maintenance.

  **Staff**: 5 seasonal brewers (November through March), 2 year-round (Greg plus one).

  **Production**: Approximately 2,500 barrels annually. Product line: barrel-aged imperial stout (flagship, 14 months aging), farmhouse ale (volume seller), pale ale, and seasonal limited releases. Locally grown barley, Appalachian hops, mountain spring water, in-house cultivated yeast, proprietary fermentation blends.

  **Key projects**:

  - **2026 brewing season wrap-up**: 14 batches in February 2026, all successful. Experimental barrel-aged imperial stout flagged for competition. Currently in post-season conditioning, blending, and bottling.
  - **Export market expansion**: Working with British Craft Imports (UK) and Pacific Craft Distributors (Singapore) to grow exports from 10% to 20% of production. British Craft Imports has requested a 20% volume increase; Pacific Craft is asking for an exclusive barrel-aged allocation. Target: new UK pub partnerships by October 2026.
  - **Brewery renovation Phase 2**: Fermentation room climate control plus tank temperature monitoring. Phase 1 (cold storage) completed 2025. Phase 2 budget: $350,000. Contractor: Blue Ridge Construction. Window: August through September 2026, must complete before November brewing season.
  - **2027 experimental expression**: Barrel-aged imperial stout using 100% locally malted barley at an extended 18-month aging.

  **Professional development**: Entering the 2026 Great American Beer Festival and the World Beer Cup. Considering a Belgian study trip in autumn 2027 (monasteries, Wallonia farmhouse breweries, Brussels bars).

  ## Finance

  - **Income**: Brewery net revenue drawn as salary, $5,500/month. Sarah's design income (freelance, brewery branding), $1,200/month. Household total roughly $6,700/month. Brewery annual gross revenue approximately $900,000.
  - **Housing**: Family compound attached to the brewery, owned, no mortgage. Traditional farmhouse renovated 2018. Five bedrooms. Property value roughly $500,000.
  - **Savings**: $68,000 at Blue Ridge Community Bank. $25,000 brokerage (US and global index funds). $40,000 brewery reserve. Hana's 529 education fund $22,000. Contributing $1,000/month to personal savings and investments.
  - **Vehicles**: 2021 Ford Transit van (brewery deliveries and grain transport). 2019 Subaru Forester (family). Both owned.
  - **Monthly budget**: Personal savings/investments $1,000, Hana education $250, groceries $650, dining $250, vehicles $375, utilities $280, phone and internet $120, Hana school $120, health $160, clothing $80, parent support $250, memberships and competitions $120, travel $160, miscellaneous $250. Total spend roughly $4,065, buffer roughly $2,635/month. Brewery operating costs (including Greg's $4,200/month salary) paid from brewery revenue separately.
  - **Credit**: Phase 1 renovation small business loan, $16,000 remaining at Blue Ridge Community Bank, paying $650/month. No personal debt.
  - **Goals**: Pay off the renovation loan by 2027, complete Phase 2, grow exports to 20%, win GABF gold, build savings to $120,000, fund Hana's education, preserve the brewery for the next generation.

  ## Health & Wellness

  - **Primary care**: Dr. Karen Albright at Asheville Family Clinic. Annual checkup in September. Last review September 2025: mostly good, lower back strain (occupational), mildly elevated liver enzymes (occupational hazard of tasting beer professionally, monitored).
  - **Dentist**: Dr. Mitchell at Asheville Smile Dental, every six months.
  - **Body maintenance**: Chiropractor in Asheville every four weeks for lower back and shoulder. Monthly hot spring visits in Western North Carolina mountains.
  - **Exercise**: Brewing-season physical work is primary (lifting 50 lb grain bags, stirring mash, washing equipment). Off-season: jogging three times per week along the French Broad River (three miles), Saturday walks with Hana, autumn hiking in the Blue Ridge.
  - **Sleep**: Brewing season 5 to 6 hours, interrupted by fermentation checks. Off-season 7 to 8 hours. Bed by 11 PM normally. Up at 4:30 AM during brewing season, 6:30 AM off-season.
  - **Mental health**: No formal therapy. Processes through brewhouse, hot springs, monthly conversations with Moreland, and family time. Sarah is the emotional anchor. Seasonal intensity followed by off-season decompression is the natural cycle.
  - **Supplements**: Glucosamine (joint support), vitamin B complex (liver support), magnesium.
  - **Allergies**: None.

  ## Interests & Hobbies

  - **Brewing-adjacent reading**: A small library of out-of-print brewing texts treated with the reverence other people give to first editions. Currently two years into a Belgian monastic brewing tradition that generates an experiment every paragraph.
  - **Beer journaling**: Handwritten notes on every batch since the apprentice years. A shelf of journals above the brewhouse office desk. He can pull a 2014 journal and tell you the third-day fermentation temperature of the batch he is comparing against.
  - **Walking with Hana**: Saturday mornings, regular route, regular bakery stop. The most carefully protected hour of his week.
  - **Hiking the Blue Ridge**: Off-season autumn weekends, alone or with Sarah. Has worked out more brewing problems on a ridge trail than at a desk.
  - **Hot springs**: Western North Carolina mineral springs as recovery practice, monthly. Regional inheritance more than hobby.

  ## Home & Living

  - **Home**: Traditional farmhouse attached to the brewery compound. Five bedrooms (three in the main house with open-plan living and a 2018-renovated kitchen, plus a separate wing for Thomas and Margaret). Small garden. Stone path to the brewhouse.
  - **Aesthetic**: Brewhouse-functional. Copper, wood, stone, the smell of yeast, the soft late-afternoon light through high windows. Resisted modernisation beyond what production reliability requires. The new climate control system is the largest aesthetic compromise.
  - **Family farmhouse**: Comfortable rather than designed. Sarah handles most decorating. Bookshelves functional. The kitchen is the room everyone gathers in. Walls hold grandparents in front of the brewery, beer-festival ribbons in shadow boxes, and a watercolour Hana painted that Larry refuses to take down.
  - **Home projects**: Kitchen ventilation upgrade, Hana's room redecoration (reading corner), garden path repair (frost damage).
  - **Personal style**: Work shirts and jeans most days. The same boots he has owned for seven years. One good flannel for cold mornings. One wool coat for outdoor industry events. One suit, bought for an industry award ceremony, that has come out twice.

  ## Devices & Services

  - **Phone**: iPhone 14. Calls, text messaging (primary), email, weather apps (critical during brewing season), camera (documenting brewing), banking, craft beer news.
  - **Laptop**: ThinkPad X1 Carbon for business operations (email, accounting, distributor management, production records, research).
  - **Sarah's laptop**: MacBook for her design work. Not connected to the brewery agent.
  - **Brewery tech**: Temperature monitoring sensors in fermentation tanks (phone alerts during brewing season), fermentation room climate control (Phase 2 upgrade), traditional tools alongside modern monitoring.
  - **Smart home**: Minimal. The house is traditional. Smart thermostat for the modern kitchen area. Wi-Fi throughout.
  - **Subscriptions**: Spotify, Netflix, local PBS station, *Wall Street Journal* digital, Brewers Association membership, Asheville Craft Brewers Guild membership, brewing science journal.

