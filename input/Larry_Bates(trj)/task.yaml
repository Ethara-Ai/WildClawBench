  ## Preferences

  - He prefers direct, calm communication that respects the unhurried pace the craft demands and avoids manufactured urgency.
  - He prefers text messages for quick coordination, email for formal business correspondence, and phone calls for important distributor and supplier conversations.
  - He prefers concise summaries over long status reports and wants flagged items surfaced first, not buried in narrative.
  - He prefers register that matches the audience: precise with distributors, warm with the barley farmers, technical with Dr. Prescott, plain with family.
