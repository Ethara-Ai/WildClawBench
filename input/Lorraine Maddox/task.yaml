  ## MEMORY.md

  # Memory: Lorraine Maddox

  ## Personal Profile

  Born in Bristol, England, to a West Country father and a London mother. Moved to Porto at eighteen for university and has not left. British by birth, Portuguese by daily practice; the Britishness shows in her humour, her tea, and her reading, and the Portuguese-ness shows in her speech rhythms, her mealtime sense, and her relationship to the city itself.

  Education: Licenciatura in Urban and Regional Planning, FEUP (2013). M.Sc. in Sustainable Urban Design, Nordlund Institute of Design, Sweden (2015). Erasmus exchange at Delft Institute of Urbanism. Languages: English (native), Portuguese (fluent, slight British accent), French (fluent), Swedish (conversational, from Lund years), basic Dutch (from Delft).

  Religion: raised loosely Anglican, has internalised the ethical content without continuing the observance. Closest thing to a sacred practice is the long Sunday walk along the Douro.

  Personality: thinks before she speaks. Direct without being brusque, warm without being effusive. Reads other people's body language with the same attention she reads a streetscape. Carries a slow-burning frustration with the political compromises her work requires and manages it with walks, sketching, and long conversations with Brian. Loyal in ways that have occasionally cost her professionally; has refused private-sector job offers because the work needs to happen inside the municipal system.

  Philosophy: good planning is invisible. Streets that feel safe, parks that draw families, transit that just works are the discipline's highest expression. Public participation is a design input, not a regulatory checkbox. Holds heritage and progressive instincts in deliberate tension; the planners who resolve that tension cleanly in either direction usually produce worse work.

  ## Key Relationships

  - **Brian Coleman**, 36. Partner, together 3 years. Structural engineer at a private firm. Calm, detail-oriented, shares her love of architecture and Porto's built heritage. Living together in Cedofeita; discussing buying an apartment. He cooks weeknight dinners; she cooks weekends. Communicates: WhatsApp and call. Shared calendar.
  - **Patricia Maddox**, 62. Mother. Retired primary school teacher. Lives with Donald in Foz do Douro. Active in the local British expatriate community. Sunday lunch is a fixture. Warmer relationship than a decade ago. Communicates: phone call.
  - **Donald Maddox**, 65. Father. Retired civil engineer, worked on Porto Metro construction. Foz do Douro. Shares the urbanism conversation that has run since her childhood. Health: managing mild hypertension, otherwise good. Communicates: phone call.
  - **Richard Maddox**, 38. Older brother. Architect at a studio in Lisbon. Married to Jessica, one child (Megan, 6). Visits Porto monthly. Occasional professional collaborator. Communicates: WhatsApp.
  - **Jessica Maddox**, 37 (née Harper). Richard's wife. Interior designer. Warm and artistic. Lorraine consults her on materials for public space design. Communicates: WhatsApp.
  - **Christine Maddox**, 29. Younger sister. Environmental scientist at a research institute in Coimbra. Single, passionate about climate policy. Close with Lorraine: they speak twice a week. Communicates: WhatsApp and Thursday 8 PM call.
  - **Megan**, 6. Niece, Richard and Jessica's daughter. Has decided Aunt Lorraine is the most interesting adult in the extended family. The assessment is correct.
  - **Dr. James Crawford**, 52. Head of Urban Planning and Heritage at Câmara Municipal. Direct supervisor. Supportive but politically cautious. Long professional relationship. Communicates: email.
  - **Andrea Mitchell**, 33. Close friend and fellow urban planner at a private Porto consultancy. Studied together at FEUP. Monthly dinners and professional brainstorming. Communicates: WhatsApp.
  - **Prof. Michael Saunders**, 60. Former thesis advisor at FEUP, now emeritus. Occasional mentor on heritage-planning intersections. Communicates: email.
  - **Grace Bennett**, 45. President of the Cedofeita Neighbourhood Association. Community leader and stakeholder in several of Lorraine's projects. Direct, passionate, respected. Communicates: WhatsApp.

  ## Work & Projects

  Employer: Câmara Municipal do Porto, Department of Urban Planning and Heritage. Senior Planner. Also runs EU-funded consulting engagements with departmental approval. Tenure: ten years in the discipline, current senior role at the Câmara since 2021.

  Focus areas: urban regeneration, public space design, heritage-sensitive densification, and climate adaptation. Schedule: office Monday to Friday, 9 AM to 6 PM; site visits 2 to 3 times per week; community consultation evenings as scheduled; consulting work on personal time with department approval.

  Current projects:

  - **Campanhã Riverfront Regeneration**. Lead planner. Transforming a former industrial waterfront into mixed-use public space with green corridors, affordable housing, and transit integration. Community consultation phase: 4 sessions completed, 2 remaining. Council submission target October 15, 2026.
  - **Cedofeita Pedestrian Zone Expansion**. Designing an expansion of the pedestrian network connecting the existing commercial corridor to Jardim do Marquês. Traffic impact study underway. Stakeholder consultations with businesses and residents in progress.
  - **EU Green Corridors Grant Application**. Cross-border application with Vigo, Spain, for EU Horizon funding to develop green infrastructure corridors linking the two cities. Application due October 2, 2026.

  Professional development: invited to present at the European Urban Planning Congress, Brussels, November 9 to 11, 2026 (presenting on Day 2). Considering a short course in climate-adaptive urban design at the Zurich Institute of Urban Futures in 2027.

  ## Finance

  Income: roughly €3,400/month from the municipal salary, plus an averaged €600/month from consulting. Combined approximately €4,000/month.

  Housing: rents a 2-bedroom apartment in Cedofeita at €950/month, split with Brian (her share €475).

  Savings: €16,800 in the Millennium BCP emergency-fund account, building toward a €20,000 target at €350/month. Small sustainable investment of €4,200 in the European Sustainable Futures Fund (managed by Nordvik Asset Management S.A., Luxembourg; ISIN LU0987654321; account reference ESF-PT-08841), held via Millennium BCP and contributing €100/month by direct debit on the 1st. Credit card paid monthly. No debt. Swedish CSN student loan repaid in 2023.

  Monthly budget (totals roughly €2,090):

  - Rent €475, Savings €350, Investment €100, Transport €55 (Metro pass plus occasional car share).
  - Groceries €280, Dining and coffee €170, Pilates €75, Osteopath €40 (averaged).
  - Phone and internet €50, Subscriptions €35, Personal insurance €60, Clothing €70.
  - Books and professional development €80, Travel fund €100, Misc €150.

  Buffer: roughly €1,310 in lean months, around €1,900 with consulting income.

  Tax: PAYE for the municipal salary, self-assessed for consulting. Accountant Mary Jane Richardson at Richardson Contabilidade, Porto.

  Stated goals: top up emergency fund to €20K, apartment deposit with Brian by 2028, fund the Brussels trip from current cashflow, build a Zurich course fund through 2027.

  Philanthropy: quiet contributions to a Portuguese heritage preservation fund, the Cedofeita Neighbourhood Association, and a small grant programme supporting young women in planning that her supervisor runs. Treats these as overhead, not virtue.

  ## Health & Wellness

  - Primary care: Dr. Margaret Lewis at Centro de Saúde de Cedofeita. Annual checkup in November; last one November 2025, all clear.
  - Dentist: Dr. Paul Oliver at Clínica Dentária Cedofeita. Every 6 months.
  - Osteopath: Dr. Theresa Palmer. Every 6 weeks for posture correction.
  - Exercise: runs 3x/week along the Douro riverfront (Foz route, Monday/Wednesday/Friday). Pilates 2x/week in Boavista (Tuesday/Thursday, 6:30 PM). Walks extensively: to work, on site visits, for thinking.
  - Mental health: no formal therapy. Clarity through walking and sketching. Talks things through with Brian and Andrea. Stressful period in 2024 when a major project faced political opposition; learned to separate professional setbacks from personal worth.
  - Sleep: 7.5 hours, lights out 11 PM, up 6:30 AM. Fiction before bed is the wind-down.
  - Supplements: Vitamin D, magnesium.
  - Dietary medical note: mild lactose sensitivity. Uses plant-based milk in home coffee; tolerates cheese and yogurt.

  ## Interests & Hobbies

  - **Urban sketching**: sketchbook in her bag, drawings made at cafés, on benches, at long meetings. The sketchbook from each year is an unintentional record of how Porto has shifted; the drawings are how she thinks.
  - **Walking**: to work, on project sites, through the city for thinking. She has worked out more design problems on the Douro riverfront than at her desk. Strong opinions about which Porto streets are walkable in which seasons.
  - **Reading**: urban planning theory at the desk, English-language literary fiction on the bedside table, architecture monographs on the coffee table. Gehl's *Cities for People* is a touchstone. She reads slowly and underlines in pencil.
  - **Running**: three mornings a week along the Douro at a comfortable pace, one direction, podcast in ears.
  - **Azulejo photo essay**: a near two-year personal project documenting Porto's vanishing tiled facades. Close to six hundred images so far. Not in a hurry to publish; the slow accumulation is the project.
  - **Sunday walks**: long, unhurried, often through a neighbourhood she is studying.

  ## Home & Living

  - Renovated 2-bedroom apartment in Cedofeita, Porto. High ceilings, azulejo-tiled hallway, small balcony overlooking a courtyard. Walking distance to the office, the markets, and the river. Rented, with intent to buy an apartment with Brian by 2028.
  - Balcony garden: herbs, geraniums, a small lemon tree.
  - Brian is building custom bookshelves for the living room.
  - Considering adopting a rescue cat from a local Porto shelter.
  - No car. Walks within the city and uses the Metro for distance.
  - Aesthetic: comfortable rather than designed. Pale walls, selective art, kitchen as the centre of the apartment. Natural materials, considered objects, items that age well.

  ## Devices & Services

  - Phone: iPhone 15. Used for WhatsApp, email, camera (site documentation), transit apps, and sketching reference photos.
  - Laptop: MacBook Pro M2. Email, QGIS, AutoCAD, report writing, presentations.
  - Professional tools: measuring tape, laser distance meter, quality sketchbook and pens for site visits.
  - Smart speaker for music and timers. Minimal smart-home footprint by choice.
  - Subscriptions: Spotify, one streaming service shared with Brian, Ordem dos Urbanistas (professional association), *The Urbanist Review* digital newsletter, Adobe Creative Cloud (for consulting).

