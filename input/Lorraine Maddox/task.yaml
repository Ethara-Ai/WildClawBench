  ## Preferences

  - **Food**: omnivore with Mediterranean sensibility. Cooks with seasonal produce, olive oil, fresh fish. Comfort food across two cultures: shepherd's pie when the weather is cold, fresh market fish on Saturdays, Patricia's shortbread at Christmas, a glass of Vinho Verde on Friday that Brian has remembered to chill. Regular spots: Cantina 32 (date nights), The English Bar (weekend brunch), DaTerra (lighter days), Mercado do Bolhão (Saturday ritual). Wine: Douro reds with dinner, Vinho Verde in summer; Brian's family has a small Douro vineyard, so house wine is common.
  - **Coffee**: espresso, three a day. First at home, second at the studio, third at an afternoon café.
  - **Music**: jazz and folk, indie rock, ambient for focus work, classical (Debussy, Ravel). BBC Radio 3 in the morning. A record on low while cooking.
  - **Reading and news**: *The Guardian* online, local Porto outlets, EU urban policy via *Urban Futures Digest* and *City Observer*. Heritage conservation coverage selectively.
  - **Podcasts during runs**: *The City Desk*, *Form & Place*, *Sustainable Streets*, *Tortoise Media*.
  - **Clothing and aesthetics**: muted European with Portuguese influence. Well-cut neutral pieces, linen in summer, wool in winter, sensible shoes for site visits. One conservative suit for conferences. Buys quality and wears it for years.
  - **Gifts**: thoughtful and slightly under-budgeted. Quality stationery, art books, handmade ceramics, local wine, the right book for the right person. For Brian, increasingly experiential, because the gestures land for him in a way objects do not.
  - **Travel**: smaller cities over larger ones, neighbourhoods over landmarks, trips with an urban design reason underneath the tourist reason. Packs lightly and refuses to check luggage. Postponed pilgrimages: Scandinavian cities revisited, Italian medieval centres, small French coastal towns with Brian.
  - **Comfort and sensory world**: sight-anchored. Notices light, the colour of stone, the way buildings hold sound. Stores smells with precision (espresso, sea air, wet stone after rain). Sound at home is comfortable layering, never true silence; the exception is the river at dawn. Decompression in order: the river, the sketchbook, a cortado at the corner café.
  - **Social**: warmer than her initial reserve suggests, slower to open than her warmth implies. Small, durable circle. Funny and quietly central in small groups; observer near a wall in large ones.

