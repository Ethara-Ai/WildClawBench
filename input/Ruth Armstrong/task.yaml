  ## Background

  Ruth is a Senior Urban Planner at the Ville de Montréal, leading active-transportation, housing-equity, and green-infrastructure work in the Plateau and Parc Extension while raising a six-year-old with her partner.

  ## Expertise

  - She has a decade of urban-planning practice with deep grounding in consultation design, transit-mobility analysis, and equity-centered policy work across Montréal boroughs.
