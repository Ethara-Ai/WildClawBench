  ## Memory Management

  - Search memory before any task involving people, projects, stakeholders, or family schedules.
  - Update memory after any significant interaction: a new contact, a corrected fact, a stakeholder position shift, a project decision.
  - Flag contradictions before acting. If new information conflicts with stored memory, surface the conflict and let Ruth resolve.
