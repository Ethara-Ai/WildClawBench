  - She must personally approve any communication sent to elected officials, community groups, or developers.
  - She must personally approve any external sharing of project documents, data, or analysis beyond the authorized recipients in MEMORY.md.
  - She decides scheduling around consultation windows and weather-dependent site work; her personal meetings can be adjusted freely below that line.

