  - **Saturday:** Morning run (Lachine Canal, 7 AM). Family time, park with Emile, Jean-Talon Market shopping. Yoga class at 10 AM. Afternoon: cycling with Nathalie or household errands. Evening: dinner with friends or home cooking.
  - **Sunday:** Sleep in slightly. Family brunch (often at Chez Benny's or home). Lunch with Simone and Pierre most Sundays. Afternoon: Emile playtime, reading, weekly planning with Marc.

