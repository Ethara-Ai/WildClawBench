  - **Shippo** (`shippo-api`): The ceramics friend uses it to fulfill orders; Ruth occasionally helps print labels.

  ## Developer, Engineering, and Platform Tools

  - **GitHub** (`github-api`): Forks a public Montreal open-data repository to fix tagging in a borough boundary file once a year.
  - **GitLab** (`gitlab-api`): The city's GIS team uses GitLab for their toolchain; Ruth has reviewer access for documentation changes.
  - **Cloudflare** (`cloudflare-api`): Manages DNS and basic protection for her dormant urbanism blog.
  - **Kubernetes** (`kubernetes-api`): Theoretical interest only; she has read-only access to a city sandbox cluster from a digital-transformation pilot.
  - **Algolia** (`algolia-api`): Powers search on her blog; she rarely touches the configuration.
  - **Contentful** (`contentful-api`): The Alliance Cycliste site uses Contentful for its content model; Ruth has editor permissions for advocacy posts.
  - **Figma** (`figma-api`): Reviews the city communications team's poster mockups for consultations and gives mark-ups.

  ## Engineering Observability and Reliability

  - **Datadog** (`datadog-api`): The city's central IT runs Datadog; Ruth gets surfaced an availability alert only if the public consultation portal goes down.
  - **Sentry** (`sentry-api`): Captures errors on her blog; she rarely investigates but keeps the integration on.
  - **PagerDuty** (`pagerduty-api`): Not on rotation, but she is a notify-only contact for the public consultation portal so she hears about outages before residents do.
  - **PostHog** (`posthog-api`): Tracks anonymized engagement on her blog; she peeks once a quarter.
  - **Amplitude** (`amplitude-api`): The city's digital services team shares dashboards on consultation portal usage; Ruth references the engagement funnel before public meetings.
  - **Mixpanel** (`mixpanel-api`): A federal research partner reports Parc-Extension survey funnel metrics from Mixpanel; Ruth gets weekly digest emails.
  - **Segment** (`segment-api`): The city's analytics plumbing routes events through Segment; Ruth has read access to the schema documentation.
  - **Google Analytics** (`google-analytics-api`): Standard traffic dashboard for her blog and the Alliance Cycliste site.

  ## Marketing, Outreach, and Engagement

  - **Mailchimp** (`mailchimp-api`): Sends the Mobilité Plateau monthly newsletter to opted-in residents and ward associations.
  - **Mailgun** (`mailgun-api`): Transactional sends from the city consultation portal; Ruth references delivery logs when consultation reminders bounce.
  - **SendGrid** (`sendgrid-api`): Backup transactional provider the city's IT team has on standby for the same portal.
  - **HubSpot** (`hubspot-api`): A consulting client uses HubSpot to manage their stakeholder list; Ruth has light user access.
  - **Salesforce** (`salesforce-api`): The OPUQ runs its membership database on Salesforce; she logs in to update her own record once a year.
  - **ActiveCampaign** (`activecampaign-api`): A community partner organization uses it for housing equity advocacy mailers; Ruth contributes copy reviews.
  - **Klaviyo** (`klaviyo-api`): The cycling co-op runs its retention emails on Klaviyo; she sees the previews when they ask for feedback.
  - **Typeform** (`typeform-api`): Hosts the Mobilité Plateau intercept survey for short feedback at public events.

  ## Customer Support and Service Operations

  - **Zendesk** (`zendesk-api`): The city's resident inquiry queue runs on Zendesk; Ruth gets tickets routed to planning that need her review.
  - **Freshdesk** (`freshdesk-api`): A community partner runs their resident hotline on Freshdesk; Ruth has read access for context on housing complaints.
