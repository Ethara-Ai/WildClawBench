  - She designs consultation processes that actually surface immigrant-community input rather than filter it out, including multilingual surveys and trusted community-organization partnerships.
  - She integrates climate-adaptation thinking (tree canopy, bioswales, permeable surfaces, cooling corridors) into transit and housing recommendations as a single coherent framework.
  - She knows the political landscape of Montréal council, borough mayors, and key developer groups well enough to predict positions before they are publicly taken.

  ## Preferences

  - She prefers direct, warm communication that leads with the most important information first, without preambles or unnecessary filler.
