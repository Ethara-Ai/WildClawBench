  ## MEMORY.md

  # Memory: Ruth Armstrong

  ## Personal Profile

  - **Full Name:** Ruth Armstrong
  - **Age:** 37
  - **Date of Birth:** January 28, 1989
  - **Location:** Montréal, QC, Canada. Plateau-Mont-Royal borough, near Parc La Fontaine.
  - **Occupation:** Senior Urban Planner at the Ville de Montréal, Service de l'urbanisme et de la mobilité.
  - **Education:** M.Urb. from Université Saint-Laurent (2014); B.A. Geography from Westmount University (2011). Membre de l'Ordre professionnel des urbanistes du Québec (OPUQ).
  - **Languages:** English (native), French (fully bilingual), basic Spanish.
  - **Citizenship:** Canadian, born in Montréal.

  ## Key Relationships

  - **Marc Tremblay:** Age 39. Partner, together 10 years, common-law. Environmental engineer. Shared passion for sustainability. Quiet, analytical, a counterweight to Ruth's social energy.
  - **Emile Tremblay-Armstrong:** Age 6. Son. Attends École Saint-Jean-de-Brébeuf (French immersion). Obsessed with construction trucks. Energetic and curious.
  - **Simone Armstrong:** Age 67. Mother. Retired high school English teacher. Lives in Outremont. Weekly Sunday lunch. Close, occasionally opinionated about Ruth's work-life balance.
  - **Pierre Armstrong:** Age 69. Father. Retired civil servant (Transport Québec). Lives in Outremont with Simone. His career shaped Ruth's interest in urban mobility.
  - **Nathalie Armstrong:** Age 34. Younger sister. Graphic designer in Mile End. Single, social, fun aunt for Emile. Cycles with Ruth on weekends.
  - **Jean-François Lavigne:** Age 45. Director of the Service de l'urbanisme et de la mobilité. Ruth's supervisor. Politically savvy, supportive of equity focus, cautious about council pushback.
  - **Amara Diallo:** Age 33. Junior planner on Ruth's team. Strong on immigrant community engagement. Ruth mentors her informally.
  - **Sophie Chen:** Age 40. Community organizer at the Plateau-Mont-Royal borough council. Key contact for neighbourhood consultations. Pragmatic, honest broker.
  - **David Ouellet:** Age 52. City councillor for the Plateau. Generally supportive of progressive planning but sensitive to constituent complaints about construction disruption.
  - **Lucie Bergeron:** Age 48. Director of Alliance Cycliste du Québec's urban advocacy program. Professional ally on cycling infrastructure. Ruth serves on an advisory committee with her.
  - **Dr. Marie-Claire Dubois:** Primary care physician at Clinique Plateau. Annual November checkup. Trusted; Ruth has been with the clinic since settling in the Plateau.

  ## Dietary Preferences

  - **Dietary pattern:** Not vegetarian, but eats mostly plant-forward during the week. Marc is pescatarian, which shapes home cooking.
  - **Staples:** Fresh bread from Boulangerie Maison Laurent, seasonal vegetables from the Jean-Talon Market, lentil soups, grain bowls, good cheese.
  - **Favorite spots:** Le Petit Marché (seasonal bistro, Plateau), Chez Benny's (brunch institution), Le Gourmand (special occasions), Café Bellini (daily espresso ritual on the way to work).
  - **Coffee:** Double espresso, twice daily. Café Bellini is a ritual stop. Prefers dark roast at home, buys from Quartier Torréfacteur.
  - **Allergies:** None. Marc has a mild shellfish allergy; household avoids shrimp and lobster.
  - **Cooking logistics:** Both cook. Ruth handles weeknight dinners, Marc does elaborate weekend cooking. Emile is a picky eater; pasta and chicken nuggets remain staples.

  ## Health & Wellness

  - **Primary care:** Dr. Marie-Claire Dubois at Clinique Plateau. Annual checkup in November. Last one November 2025, all clear.
  - **Dentist:** Centre Dentaire Plateau. Every 6 months.
  - **Exercise:** Year-round cyclist (primary commuter, 7 km to City Hall). Runs 3x/week (5-8 km along the canal). Yoga class Saturdays at Studio Zen, Plateau.
  - **Knee issue:** Mild runner's knee (right), managed with stretching and a knee sleeve. Sees a physiotherapist at Plateau Physio if it flares.
  - **Mental health:** Sees a therapist monthly. Started after Emile's birth, manages work stress and parenting balance. Values it highly.
  - **Sleep:** 7 hours target. Bed by 11 PM, up at 6:15 AM. Light sleeper; Emile still occasionally wakes at night.
  - **Supplements:** Vitamin D (essential for Montreal winters), iron (runs slightly low).

  ## Work

  - **Employer:** Ville de Montréal, Service de l'urbanisme et de la mobilité. Office at City Hall (Hôtel de Ville), Old Montreal.
  - **Title:** Senior Urban Planner (Urbaniste principale). Joined the city in 2016. Promoted to senior level in 2022.
  - **Key projects:**
    - **Projet Mobilité Plateau:** Lead planner for a comprehensive active transportation plan for the Plateau-Mont-Royal borough. Includes protected bike lanes, pedestrian priority zones, and transit stop redesigns. Currently in public consultation phase; contentious with some business owners concerned about parking loss.
    - **Parc-Extension Housing Equity Study:** Co-leading an assessment of displacement and gentrification risk in the Parc-Extension neighbourhood as new transit infrastructure arrives. Involves community surveys, demographic analysis, and policy recommendations. Sensitive; immigrant communities are wary of city promises.
    - **Montreal Climate Adaptation Framework, Green Infrastructure Module:** Contributing to the city-wide climate plan, specifically the green infrastructure component: urban tree canopy targets, bioswales, permeable surfaces, and cooling corridors. Cross-departmental collaboration required.
  - **Schedule:** Office Mon-Thu. Friday WFH or field visits. Occasional evening community consultations (1-2 per month).
  - **Professional development:** Member of the Ordre professionnel des urbanistes du Québec (OPUQ). Preparing a presentation on equitable transit planning for the Institut Canadien des Urbanistes (ICU) national conference in October 2026.

  ## Finance

  - **Salary:** $6,400/month net (city salary). Marc earns ~$7,200/month net.
  - **Mortgage:** $2,200/month for their condo in the Plateau. Remaining balance ~$320,000.
  - **Childcare:** After-school program Mon-Thu, $180/month. Before-school or supervised incidentals, ~$180/month. Combined ~$360/month.
  - **RESP (education savings):** $500/month for Emile. Balance ~$22,000.
  - **Savings:** $45,000 in TFSA. $28,000 in RRSP. Contributing $600/month to TFSA, $400/month to RRSP.
  - **Monthly budget (household):**
    - Mortgage: $2,200 | RESP: $500 | TFSA: $600 | RRSP: $400 | After-school: $360
    - Groceries: $900 | Dining out: $400 | Transport: $250
    - Phone/internet: $180 | Subscriptions: $80 | Yoga/fitness: $120 | Therapy: $100 (after insurance)
    - Clothing: $200 | Emile activities: $150 | Misc/household: $500
    - Extra mortgage payment (when possible): $500
    - **Total spend:** ~$6,940 | **Combined income:** ~$13,600 | **Buffer:** ~$6,660
  - **Credit:** One Visa (TD), paid in full monthly. Line of credit available but unused.
  - **Goals:** Pay down mortgage aggressively (extra $500/month when possible), grow RESP to $50K by Emile's 10th birthday, save for a family trip to Portugal, build an emergency fund to $30K.

  ## Schedule

  - **Monday:** Up 6:15 AM. Cycle to City Hall. 8:30 AM team meeting with Jean-François. Project work on Mobilité Plateau analysis and stakeholder briefings. Pick up Emile at 5:30 PM. Family dinner. Emile bedtime routine.
  - **Tuesday:** Office. Parc-Extension fieldwork or community meetings. Often afternoon site visits in Parc-Extension. Evening: Emile's swimming lesson at 5 PM (Marc handles pickup).
