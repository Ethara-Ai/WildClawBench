  ## MEMORY.md

  # Memory: Jae Chandler

  ## Personal Profile

  Jae Chandler is a master electrician, a Milwaukee tradesman of Korean descent, and the steady center of a busy family and small business. He learned the trade from the ground up: an apprenticeship through the Milwaukee Electrical Joint Apprenticeship and Training Committee (JATC) completed in 2005, a journeyman license that same year, and a master electrician license in 2012. He holds no college degree and is unapologetic about it; he knows what it took to reach master, and the blue-collar pride is earned, not performed.

  He is a U.S. citizen, born in Milwaukee. His parents immigrated from Seoul, South Korea in 1975, and his father Byungho anglicized the family surname to Chandler at naturalization in the late 1970s, choosing an English surname to ease his work in American manufacturing while keeping Korean first names for the family. Jae speaks English natively and Korean fluently, using Korean at home with his parents, at community events, and with some clients in the Korean community.

  He moves at a deliberate pace, listens longer than he talks, and repeats a client's words back in slightly different form to confirm understanding, a habit picked up from his apprentice instructor. His Korean-American identity is unselfconscious: Korean at home and church, Milwaukee working life everywhere else. His Christian faith is rooted in the Korean Presbyterian church, where he is a deacon; it is practiced rather than discussed. His working philosophy is five ideas he will not be moved off: do the job right, charge fairly, keep your word, take care of your people, and honor where you came from.

  ## Key Relationships

  - **Mina Chandler (nee Park)**: Age 43. Wife, married 18 years. Office manager at a dental practice in Greenfield. Organized, warm, handles the household finances. They are a tight team and she is the one who knows the weight Jae carries as a business owner.
  - **Yuna Chandler**: Age 15. Older daughter, sophomore at Bay View High School. Plays violin in the school orchestra and runs cross-country. Studious, quiet, close with her father. She and Mina and Jae have started weighing Wisconsin in-state university options for music and pre-med, her two interests; Jae wants to give her every opportunity and has begun thinking about a college fund.
  - **Derek Chandler**: Age 11. Son, sixth grader at Fernwood Montessori. Loves basketball and video games, and has started asking how circuits work and to be taught how to wire a switch, which quietly thrills Jae.
  - **Soonja Chandler**: Age 72. Mother. Retired seamstress, devout Presbyterian, cooks enormous Sunday dinners. Lives in the family home on the south side. Still calls Jae by his Korean name in the family kitchen.
  - **Byungho Chandler**: Age 75. Father. Retired machinist from Lakefront Manufacturing. Health declining with COPD; uses a portable oxygen concentrator. Jae visits twice a week, and the warmth between them surfaces more as Byungho ages.
  - **Kevin Chandler**: Age 42. Younger brother. HVAC technician running his own small outfit. Lives in West Allis with wife Jenny and son Ethan (8). Kevin and Jae refer clients to each other regularly.
  - **Jenny Chandler (nee Yoon)**: Age 40. Kevin's wife. Elementary school teacher. Organizes family events with Mina.
  - **Tony Rizzo**: Age 50. Best friend and fellow tradesman, a plumber who owns Rizzo Plumbing. They have worked together on jobs for 15 years and share the Friday fish fry, the Door County trip, and a running mutual roast going since 2010.
  - **Ryan O'Malley**: Age 38. Lead journeyman on Jae's crew. Reliable, fast, good with clients. Six years with Chandler Electric; the trust between them is the foundation of the business running smoothly.
  - **Inspector Dan Mitchell**: Age 55. City of Milwaukee electrical inspector. Fair but strict professional relationship; Jae respects his thoroughness.

  ## Work & Projects

  - **Business**: Chandler Electric LLC, residential and light commercial electrical contracting. Licensed, bonded, insured. Based out of a small office and workshop attached to the detached garage behind the home, serving the greater Milwaukee area. Founded in 2013 after 8 years as a journeyman at Lakeside Electrical Services.
  - **Title**: Owner and Master Electrician.
  - **Crew**: Three employees. Ryan O'Malley (lead journeyman), Danny Flores (journeyman, 3 years), and Jake Parsons (4th-year apprentice).
  - **Harborview Condos Panel Upgrade**: 24-unit residential building in Walker's Point, full electrical panel replacement. In progress, targeting completion October 2026. Largest contract this year at $85,000. Crew assignments split Ryan on units 7 to 12, Danny and Jake on 13 to 18.
  - **Bay View Historic Home Rewire**: Full rewire of a 1920s home on Kinnickinnic Avenue, navigating historic preservation requirements. Permit approved, work starting November 2026.
  - **Solar Integration Certification**: Pursuing NABCEP solar PV installer certification to expand into residential solar. Studying for the exam (Sunday evenings, 1 to 2 hours), targeting fall 2026. Driven by growing client demand, not passion for solar.
  - **Schedule shape**: Job sites Monday to Friday, roughly 7 AM to 4 PM, admin in the evenings, occasional Saturdays for urgent work. Attends Milwaukee IBEW chapter meetings quarterly.

  ## Finance

  - **Business revenue**: Roughly $420,000 per year gross. After business expenses, payroll, and insurance, Jae's personal income from the business is about $105,000 per year gross; approximately $6,500 per month net personal take-home after taxes.
  - **Mortgage**: $1,500 per month on the 4-bedroom Cape Cod in Bay View. Purchased 2008, refinanced 2020.
  - **Business loan**: $28,000 remaining on the equipment loan at $450 per month, scheduled payoff by 2031, though Jae would like to clear it early if business stays strong.
  - **Savings**: $35,000 in savings, contributing $400 per month toward a $45,000 emergency fund target.
  - **Retirement**: SEP-IRA, contributing $800 per month, balance about $92,000.
  - **Monthly personal budget**: Mortgage $1,500, equipment loan $450, savings $400, SEP-IRA $800, groceries $550, dining and coffee $180, car and truck and gas $350, kids' activities $200, church tithe $200, phone and internet $90, subscriptions $35, chiropractor $75, clothing $80, miscellaneous $250. Total spend about $5,160, buffer about $1,340. Mina contributes her salary of about $48,000 per year; the combined household is stable and comfortable.
  - **Credit**: One business card and one personal card, both paid in full monthly. No revolving debt.
  - **Goals**: Emergency fund to $45,000, pay off the equipment loan early, SEP-IRA to $150,000 by 50, and start a college fund for Yuna.

  ## Health & Wellness

  - **Primary care**: Dr. Michael Brennan at Bay View Family Health. Annual physical in October; last one October 2025 showed elevated cholesterol and borderline high blood pressure, with a recommendation for diet changes and more cardio. Trying to lose 15 pounds per doctor's orders.
  - **Dentist**: Dr. Patricia Walsh at Greenfield Dental, where Mina works, every 6 months.
  - **Chiropractor**: Dr. Steven Lund at Bay View Chiropractic, monthly, for chronic lower back tightness from years of trade work.
  - **Exercise**: Two-mile walks with Mina on Monday, Wednesday, and Friday mornings; basement weight room Tuesday and Thursday evenings; physical job-site labor on top of that.
  - **Sleep**: 7-hour target, bed by 10 PM, up at 5:15 AM. Solid sleeper.
  - **Supplements**: Fish oil, vitamin D, glucosamine for joints.
  - **Diet adjustments**: Cut beer back from daily to weekends only in 2025. Mina has been pushing more vegetables and fish over the last year.
  - **Mental health**: No formal therapy. Talks things through with Mina and Tony. Considered counseling after his father's 2024 health scare but did not follow through.

  ## Interests & Hobbies

  - **1978 Chevy C10 restoration**: A three-year garage project, about 60 percent done, no deadline and no commercial intention. The truck will be Derek's eventually if he wants it. The point is the work, not the destination.
  - **Basement finishing project**: Framing and electrical are done; drywall and flooring are paced through summer 2026. Kevin helps when he can; Tony shows up with takeout and unrequested commentary.
  - **Coaching Derek's basketball**: A recreational team in the winter season, now three winters running and one of his favorite weekly things despite being a baseball kid himself.
  - **NABCEP solar study**: Treated as work, blocked for Sunday evenings.
  - **Fishing**: Annual Labor Day Door County trip with Tony and Kevin, a decade-long institution.
  - **Music and sports**: Springsteen at full volume in the garage, following the Brewers and Packers, the slow turn of Wisconsin spring.

  ## Home & Living

  - **Home**: 4-bedroom Cape Cod in Bay View, built 1952, fully rewired by Jae in 2015. Detached garage with attached workshop and office for the business, and a fenced backyard with a permanent charcoal grill station he built himself in 2018 (lava rock pad, canopy, small fridge stocked with beer and soju).
  - **Aesthetic**: Solid mid-century bones, comfortable rather than designed. Family photos along the hallway, a Korean tea set on the counter, his mother's framed embroidery in the dining room.
  - **Work truck**: A Ford F-150 outfitted with a bolted-in toolbox and materials racks, with magnetic Chandler Electric LLC logo plates he attaches for client visits and removes for personal driving. Clean cab, faint smell of coffee and the cedar air freshener Mina insists on.
  - **Ongoing home projects**: Finishing the basement, building a workbench for Derek, and a kitchen backsplash replacement Mina wants, all on the list.

  ## Devices & Services

  - **Phone**: iPhone 14, used for calls, texts, calendar, and basic email. Not a heavy app user.
  - **Laptop**: HP laptop for personal and business use: invoicing, email, and basic spreadsheets.
  - **Tablet**: None.
  - **Smart home**: Nest thermostat he installed himself, plus basic smart plugs. Nothing elaborate.
  - **Subscriptions**: One streaming service (family plan), Spotify (Yuna set it up for him), Milwaukee Journal Sentinel digital, and IBEW membership dues.

