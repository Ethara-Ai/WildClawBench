  ## Preferences

  - **Food and dining**: Hearty meat-and-potatoes eater who loves his mother's bulgogi, kimchi jjigae, and galbi. Regular spots are Han's Market Deli (Korean deli, Saturday lunch tradition), Lake Country Brewing (Friday fish fry with Tony), and The Brickyard Grill (family dinners out). Drinks 2 to 3 cups of strong black drip coffee daily, nothing fancy. Mina is lactose intolerant, which shapes family cooking. Mina cooks weeknights; Jae grills on weekends year-round.
  - **News**: Reads the Milwaukee Journal Sentinel every morning, follows the Brewers and Packers, and tracks trade news through IBEW newsletters.
  - **Music**: Classic rock (Springsteen, Dire Straits, Tom Petty), Korean ballads at family events, country in the garage.
