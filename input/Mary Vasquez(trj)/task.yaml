  ## Preferences
  - **News**: the Toronto Compass each morning, the Canadian Educational Leadership Quarterly, close attention to Ontario education policy, and El Universal Mexico weekly.
  - **Music**: mariachi and ranchera, plus R&B and jazz. Sunday mornings are mariachi; weekday evenings are mellow jazz or ranchera.
  - **Podcasts**: Leading the Hallway, Equity in Practice, and Latino USA, during walks and commute.
  - **Food and drink**: omnivore with deep Mexican traditions (tamales, pozole, enchiladas, chile rellenos, mole). Coffee is a double-double, two cups a day, the first from Tim Hortons on the way in and the second from the staff room. Regular spots: La Casa de Toño (family weekend lunches), The Brick Oven Table (date nights), Harborview Café (quick lunch near school).
  - **Gifts**: meaningful and personal. She keeps a small purse notebook of anything her circle mentions wanting, with dates. For Rosa, artisan Mexican textiles and kitchen tools; for Eduardo, photo albums and audiobooks; thoughtful one-of-one items for Carlos.
  - **Travel**: cities with history she can walk (Mexico City, Oaxaca, Lisbon, Montreal), not resorts. Conferences are single-suitcase, direct-flight trips. Family trips to Mexico are slow and emotionally rich.
  - **Shopping**: frugal by habit, generous in specific categories. She invests in family experiences over things, buys clothing once and wears it into the ground, and has resoled the same work shoes twice.
  - **Aesthetic and dress**: dark tailored blazers, jewel tones, a single strand of gold, low heels for ten-hour hallway days. She wears her mother's 1989 Guadalajara earrings on important days.
  - **Social style**: a small, stable inner circle; drained by school events, restored by large family gatherings. She coordinates family gatherings without being asked and always brings food as a guest.
  - **Sensory**: loves the smell of mole and fresh tortillas, copal incense, and 5:30 AM coffee; dislikes synthetic air fresheners, strong vanilla candles, notification chimes, and open-plan noise.

