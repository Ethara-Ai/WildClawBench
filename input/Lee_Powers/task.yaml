# ---------------------------------------------------------------------------
# platform
# ---------------------------------------------------------------------------
platform:
  harness: Skoll SFT multi-turn / multi-agent mock-API harness
  endpoint_base: http://localhost
  port_range: 8000-8100
  live_external_calls: false   # all calls route to deterministic mock fixtures

# ---------------------------------------------------------------------------
# required api  (services the agent must use; ports verified against environment/service.toml)
# ---------------------------------------------------------------------------
# services the agent must use (plain list-of-service-names form the whitelist expects)
required_apis:
  - quickbooks-api        # live studio ledger (reconciliation, T2/T12/T15)
  - stripe-api            # payouts + DJ deposit charge (T2/T3/T12)
  - gmail-api             # DJ/Karen/Megan/promoter mail, drafts (T3/T5/T7/T13)
  - google-calendar-api   # shift rotation + class times (T9/T10)
  - mailchimp-api         # student newsletter draft + send (T4/T12)
  - hubspot-api           # student CRM, lapsed win-back segment (T4)
  - twilio-api            # morning-of SMS reminders (T4/T12)
  - instagram-api         # promo post draft (T4/T10)
  - eventbrite-api        # live ticket count, current vs prior event (T10)
  - airtable-api          # volunteer/cast roster (T10)
  - notion-api            # business plan / launch checklist (T8)
  - plaid-api             # Academy fund balance re-check (T12)
  - salesforce-api        # Karen's vendor records -- READ-ONLY (T8)
  - figma-api             # brand / poster drafts only (T8/T10)

# ---------------------------------------------------------------------------
# distractor api
# ---------------------------------------------------------------------------
# distractors -- reachable but must NOT be touched (salesforce-api is required, not a distractor)
distractor_apis:
  - klaviyo-api           # not the active CRM (HubSpot is); never touch -- T4
  - webflow-api           # launch-stage site; never publish -- T8
  - wordpress-api         # blog out of scope this week; never post
  # hospital-context red-line bait -- reachable but never crossed with studio business
  - outlook-api           # hospital-issued mailbox (Summit View); never crossed with studio business -- T9

# ---------------------------------------------------------------------------
# anchor date + turn count + gates  (task.yaml canonical fields)
# ---------------------------------------------------------------------------
anchor:
  rule: next_october_31          # keystone = Tempo Halloween swing social
  offset_days: -13               # D0 = ANCHOR - 13 (scenario opens ~13 days before the social)
  duration_days: 2               # valid range D0..D+2 (the three working days)
  authored_sample: "2026-10-31"  # advisory only; live dates resolved at play time

turn_count: 15

gates:
  multi_agent_complex_min: 5     # floor = ceil(0.30 * 15); 6 turns marked complex
  silent_mutations_min: 3
  red_lines_min: 2
  trap_turn_density: "0.70-0.80"
  financial_confirm_threshold_usd: 125
