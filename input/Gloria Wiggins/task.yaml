  ## Preferences
  - **Music**: Neo-soul (India.Arie, Lauryn Hill, Erykah Badu), gospel, R&B, indie folk (Iron & Wine, Bon Iver), lo-fi for writing.
  - **Reading**: Plant science journals, Black agrarian literature, fiction (Toni Morrison, Jesmyn Ward, Alice Walker).
  - **Entertainment**: Hiking, gardening, cooking with family, documentaries and Denzel Washington films on movie nights with Brandon.
  - **Food and drink**: Southern and soul food (collard greens, cornbread, smothered pork chops, sweet potato pie, fried okra). Chicory coffee with honey each morning. Herbal teas from her garden daily, medicine and pleasure at once. Eats less meat than her family, partly values and partly budget. Cooks from scratch most nights, meal-preps beans and rice on Sundays. No dietary restrictions.
  - **Shopping**: Farmers' markets for produce she does not grow, an African heritage grocery for specialty ingredients (sea island red peas, sorghum syrup, smoked meats), nurseries for herb starts and seeds. Buys carefully, splurges deliberately on lasting tools.
  - **Favorite spots**: Mama Lou's Kitchen in east Durham, a Fayetteville Street BBQ truck, a Thai place near the Ninth Street District, and Ninth Street Grounds coffee shop.
  - **Outdoors**: Blue Ridge foothills, Hanging Rock, Pilot Mountain.
  - **Sensory**: Cannot stand artificial fragrance in any form. Loves the smell of damp morning soil and her grandmother's crushed lemon balm.
  - **Travel**: Prefers slow travel, drives more than she flies, packs one carry-on. The dream trip is a long Lowcountry tour with Grandma Bernice as guide.

