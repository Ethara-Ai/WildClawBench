  ## MEMORY.md

  # Memory: Helen Sexton

  ## Personal Profile
  Helen is an Anglo-American Brooklyn freelancer whose identity is rooted partly in family, partly in place, and substantially in subculture. She holds a BA in Film Studies from Gramercy University (Class of 2015, NYC) and has spent roughly a decade in increasingly unaffordable Brooklyn neighborhoods, with a stubborn loyalty to Bushwick that her sister teases her about. Her family is working-class to lower-middle-class New Jersey: a school-administrator mother, a retired MTA father, an attorney sister, and a brother-in-law she actually likes.

  She runs on creative momentum and a slightly delayed sense of time, the friend who shows up twenty minutes late with a fully formed thesis about a film she watched at 2 AM and somehow makes the lateness feel like part of the gift. Privately she is more anxious than she lets on. The freelancer's anxiety about cash flow and the next gig sits permanently at the edge of her vision, and social anxiety after big events sits behind it. She projects competence and warmth in public, then processes the spiral privately at her desk in the small hours. She is collaborative and curious, unusually attentive to other people's craft, and quietly competitive, mostly with the version of herself she imagined she would be by thirty-three.

  Her philosophy is held together by craft: the editing, the sound design, the structural choices are what actually matter, and the surrounding ecosystem of platforms and metrics is mostly distraction. She shows up for collaborators, pays subcontractors quickly even when her own invoices are slow, is generous with credit, and refuses to badmouth other producers. She is mildly socialist in politics and New York realist in practice. She votes, posts little, and gives small amounts to local causes. Her family has a Catholic background she has drifted from without rupture, returning for weddings, funerals, and the occasional Christmas mass. She has made slow peace with single life as a real option rather than a holding pattern. She ended a three-year relationship in 2024 and is not actively dating.

  ## Key Relationships
  - **Catherine Sexton (mother)**, 61, school administrator in Newark NJ. Close. Worries about the freelance income but supports the work. Calls every Wednesday evening.
  - **Allen Sexton (father)**, 63, retired MTA bus driver, lives in Newark with Catherine. Quiet, proud, does not always understand the creative career.
  - **Susan Sexton (older sister)**, 37, corporate attorney in Hoboken NJ, married to David, daughter Nia (5). The practical one, always asking about the "retirement plan."
  - **David Bishop (brother-in-law)**, 38, Susan's husband, pharmacist, low-key cool. Bonds with Helen over basketball and movies.
  - **Taylor Jacobs (best friend)**, 34, music producer in Bed-Stuy. Friends since college. They collaborate occasionally and go to screenings together. Helen's closest confidant.
  - **Jessica Oakes (client and friend)**, 36, host of The Culture Desk. Helen's longest-running client, two years, with great creative chemistry.
  - **Noah Park (client)**, 29, tech startup founder, hosts Builder's Block. Newer client, six months, pays well but is demanding about timelines.
  - **Rachel Vance (collaborator)**, 31, freelance sound designer. Helen subcontracts complex sound work to her, and they refer clients to each other.
  - **Kevin Atkins (friend and mentor)**, 45, veteran podcast producer and consultant. Gave Helen her first freelance gig. Occasional career advisor.
  - **Lena Torres (ex)**, 32, graphic designer in Williamsburg. Amicable breakup, but they no longer talk.

  ## Work & Projects
  Helen freelances full time as a podcast producer, full service from concept through recording, editing, mixing, and distribution, with three to five active clients at any time. Her home studio is a converted, soundproofed hallway closet in her Bushwick apartment, treated with acoustic panels.
  - **Equipment**: Shure SM7B mic, Focusrite Scarlett 4i4 interface, Audio-Technica ATH-M50x headphones, MacBook Pro 16" M3, running Logic Pro and iZotope RX.
  - **Active clients**: Jessica Oakes, The Culture Desk (weekly culture and politics, 45-minute episodes, two-year client). Noah Park, Builder's Block (biweekly startup and entrepreneurship, 30-minute episodes, six-month client). Meridian Health Group, the branded podcast Wellness Forward (monthly, eight-episode season, started October 2025, Season 2 launching October 2026).
  - **Rates**: $1,500 to $2,500 per episode for full production, $500 to $800 per episode for edit and mix only.
  - **Goal**: land one more anchor client to stabilize income, and develop her own narrative series, Lost Frames, about overlooked films that did not survive their initial release. The pitch deck is in development.
  - **Industry involvement**: attends Podcast Movement conferences and is active in the Brooklyn podcast meetup group, where she co-hosts the occasional workshop on indie production workflows.

  ## Finance
  - **Average monthly income**: about $4,800 from freelance work, ranging from $3,200 to $7,000 by project load. Take-home is roughly $3,850 after quarterly taxes are set aside.
  - **Fixed costs**: rent $1,650 (rent-stabilized 1BR in Bushwick), utilities $110, phone $65, renter's insurance $25, MetroCard $66, student loans $220 (federal, about $9,400 remaining, income-driven repayment).
  - **Variable costs**: groceries $280, dining out and coffee $350 (she knows it is high and does not care), equipment fund $100.
  - **Subscriptions**: Criterion Channel $11, Letterboxd Pro $5, Cascade Music $11, Adobe Creative Cloud $55, iZotope RX license about $17 amortized monthly.
  - **Totals**: monthly expenses around $2,965, savings capacity around $885 and highly variable.
  - **Accounts**: about $8,700 in an HYSA at Greenline Digital Bank (emergency and tax buffer) and about $2,100 in checking at Greenline. Sets aside roughly $950 a month for estimated quarterly taxes.
  - **Debt**: no credit card debt. One card, paid off monthly, used for points and travel. Allergic to consumer debt.

  ## Health & Wellness
  - Generally healthy with no chronic conditions, though sedentary work habits are a concern.
  - Intermittent lower back pain from long editing sessions. Keeps meaning to buy a better chair.
  - Manages anxiety with exercise and routine. Saw a therapist for a year after the 2024 breakup, stopped in early 2025, and considers going back sometimes.
  - Runs two to three times a week in McCarren Park (3 to 4 miles), plus sporadic bodyweight work at home. Wants more consistency.
  - About 145 lbs at 5'7". Sleep is irregular, roughly 1 to 2 AM until 9 to 10 AM, worse during crunch deadlines.
  - Last annual physical February 2026 at Bushwick Family Health Center with Dr. Kevin Liu. Last dental cleaning August 2025 at Brooklyn Bright Dental, now overdue. Eyesight 20/20, no glasses needed. Vaccinations up to date.
  - No dietary restrictions. Gravitates toward spicy food and puts hot sauce on nearly everything.

  ## Interests & Hobbies
  - Film is the central, almost embarrassingly serious passion. She keeps a fierce, idiosyncratic Letterboxd presence, attends repertory screenings at small Brooklyn theaters, and can argue cinematography into the early morning.
  - Podcasting is both job and hobby. Outside client work she develops her own concepts, tinkers with sound design, and listens analytically to other producers' shows.
  - Running in McCarren Park is part fitness, part mental-health management, part the only meditation she can sustain.
  - Reading is the older, quieter habit: film criticism above all, plus essays and a slow-growing stack of books about sound and music by her bed.
  - Cooking is more theoretical than practiced. The cooking that happens is a fast stir-fry, a fridge-clearing pasta, or a careful weekend breakfast.

  ## Home & Living
  - 1BR apartment in Bushwick, Brooklyn, a 4th-floor walkup, rent-stabilized at $1,650 a month.
  - Home studio is the converted hallway closet with acoustic treatment, desk, mic arm, interface, and monitor speakers.
  - Living room doubles as a screening room with a 55" TV, a decent soundbar, and the Criterion Channel always loaded.
  - Bedroom has blackout curtains for the night-owl schedule, a queen bed, and a nightstand stacked with film books. Walls carry repertory-screening posters and a screen-printed band poster from a friend, with plants in mismatched pots.
  - No car. MetroCard, the occasional Lyft, and walking for most things in the neighborhood. Walking distance to Ember Grounds cafe, McCarren Park, and several good restaurants and bars.

  ## Devices & Services
  - MacBook Pro 16" M3 as the primary work machine, running Logic Pro, iZotope RX, Adobe Audition, and Google Workspace.
  - iPhone 15. No tablet.
  - Studio setup: Shure SM7B microphone, Focusrite Scarlett 4i4 interface, Audio-Technica ATH-M50x headphones.
  - Software: Logic Pro and iZotope RX for audio production, plus Adobe Creative Cloud.
  - Streaming and tracking accounts: Criterion Channel, Letterboxd Pro, Cascade Music.

