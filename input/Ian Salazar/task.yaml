  ## MEMORY.md

  # Memory: Ian Salazar

  ## Personal Profile

  Ian is third-generation Mexican-American, Chicano in the considered intentional sense, born and raised in the Mesilla Valley to a family longer in this place than either New Mexico or the United States have been here in their current shapes. His cultural identity is rooted in place as much as in lineage. He moves fluidly between English and Spanish, between his abuela's Spanish-only kitchen and his school's English-only classrooms, between Dia de los Muertos rituals in the family living room and Sunday football in the same room.

  He carries the early loss of his father Eduardo, who died in a car accident on Highway 70 in 2017 when Ian was sixteen. The loss sits inside him like a low constant, not a current grief that surfaces daily, but a tectonic plate that shapes the landscape. He measures himself, often unconsciously, against the man Eduardo did not live long enough to fully become.

  He is the first generation in his family to finish college and is conscious of the weight of that. His scientific bent and his artisan bent are not in tension. He takes a water sample with the same careful attention he brings to a tooled belt edge. He thinks about a watershed the way he thinks about a leather hide.

  His working philosophy is simple: do the work carefully, watch over the place you came from, take care of the people who took care of you, keep your hands honest. He believes in community as a real and earned category. He chose to come home after college against the gravitational pull of higher salaries elsewhere, and he has not regretted it. Faith is present but understated. He grew up Catholic, attends Mass with his mother occasionally, and treats the family altar at Dia de los Muertos with a real and uncynical seriousness.

  Education: BS in Environmental Science from Ridgemont State University, Albuquerque, NM (2023, summa cum laude).
  Languages: English (native, primary professional language), Spanish (fluent — used with family and in Mesilla Valley fieldwork).

  ## Key Relationships

  - **Carmen Salazar (Mom, 52)**: School secretary at Las Cruces Elementary. Emotional anchor. They live ten minutes apart and see each other almost daily. Carmen is proud of Ian's career but worries about him being alone so much. Nightly 6:30 PM call.
  - **Eduardo Salazar (Dad, deceased 2017)**: Welder and traditional knowledge keeper. Killed in a car accident on Highway 70 when Ian was sixteen. Ian carries his pocket knife daily.
  - **Rosa Salazar (Abuela Rosa, 78)**: Lives in Las Cruces. Taught Ian leatherwork from age eight. Former community organizer. Sharp-minded but slowing physically. Hip replacement in 2024, now uses a walker. Sunday visits.
  - **Marco Reyes (cousin, 27)**: Medical receptionist at the community health clinic. Closest friend and confidant. They watch reality TV together, attend fiestas together, and check on each other daily.
  - **Dr. Samuel Olivera (45, supervisor)**: Doña Ana County Environmental Services. PhD in hydrology. Mentors Ian on both science and federal bureaucracy.
  - **Dr. Lisa Brennan (50, collaborator)**: Former professor at Ridgemont State University, now co-PI on the watershed monitoring grant application. Provides the academic partnership for the proposal.
  - **Sofia "Sof" Delgado (30, ex-girlfriend, professional ally)**: NM Game and Fish Department. Amicable breakup. They still collaborate professionally on the pronghorn habitat survey and it is mostly not awkward.
  - **Diego Trujillo (26, college friend)**: Chicano nurse in El Paso. Regular texts. Visits Las Cruces periodically.
  - **Scout (Australian Shepherd mix, age 3)**: Ian's constant companion. Goes to field sites, hikes, sleeps at his feet.

  ## Work & Projects

  Environmental Scientist at Doña Ana County Environmental Services. Reports to Dr. Samuel Olivera. Started Thursday, August 2023, immediately after graduation. Office at the county government complex in Las Cruces, NM. Hours: 8 AM to 5 PM Mon-Fri in office and lab; fieldwork days run 6 AM to 4 PM. Salary $48,000.

  Current projects:
  - **Water quality monitoring program**: Twelve sites across Doña Ana County, sampled monthly. Tests pH, dissolved oxygen, turbidity, coliform bacteria, heavy metals.
  - **Watershed monitoring grant**: Proposal to Clearwater Environmental Trust for a 3-year, $320,000 multi-site monitoring program. Partnering with Dr. Lisa Brennan at Ridgemont State University. Deadline Monday, December 14, 2026.
  - **Brownfield assessment**: Former fuel storage site near Hatch. Coordinating with EPA Region 6 and county commissioners.
  - **Pronghorn habitat survey (seasonal)**: With Sofia Delgado's NM Game and Fish team. Habitat mapping using GPS data and field observations.

  Leatherwork business: Sells through the Etsy shop "Salazar Leathercraft" and at regional fiestas and mercados. Products: leather bracelets and keychains ($35 to $85), tooled leather belts ($120 to $250), custom journal covers and wallets ($200 to $400). Revenue approximately $6,000 to $8,000 per year, growing.

  He is a member of professional environmental science organizations relevant to his work in New Mexico and contributes to community-of-practice conversations within state hydrology circles.

  ## Finance

  - Salary: $48,000 per year gross (about $3,200 per month after taxes).
  - Leatherwork income: $500 to $700 per month, variable, peaks during Oct through Dec holiday season.
  - Rent: $650 per month, 2BR house in an older affordable Las Cruces neighborhood.
  - Utilities: about $140 per month. Cooling is significant in New Mexico summers.
  - Car payment: $285 per month, 2019 Subaru Outback.
  - Car insurance: $95 per month.
  - Gas: about $180 per month. Long drives to field sites and El Paso supply runs.
  - Phone: $55 per month.
  - Spotify: $11.99 per month.
  - Leatherwork supplies: $100 to $150 per month. Hides from a small Tennessee tannery, dyes, hardware.
  - Groceries: about $300 per month.
  - Student loans: $28,000 remaining (Ridgemont State University), income-driven repayment at $180 per month.
  - Savings: about $5,800 in Rio Grande Credit Union checking, about $3,200 in savings.
  - No retirement account yet. County office offers a 401(a) match; Ian has been meaning to enroll.
  - Financial stress: moderate. Salary is modest but Las Cruces cost of living is low, leatherwork supplements nicely, student loans are manageable.

  ## Health & Wellness

  - Physical: Fit and active from fieldwork and hiking. No chronic conditions.
  - Occasional lower back pain from carrying field equipment over rough terrain. Manages with a foam roller.
  - Primary care: Mesilla Valley Community Health Center. Last physical Thu, August 2025. Next due Thu, October 2026.
  - Dental: Mesilla Valley Dental Clinic, Las Cruces. Cleaning every 6 months. Last Fri, February 2026. Next due October 2026.
  - Mental health: Manages emotional weight of work and community. Grief over his father still surfaces, especially during holidays. Has learned to sit with it. No formal therapy. Has considered telehealth; nearest in-network therapist is in El Paso.
  - Exercise: Hiking 2 to 3 times per week. Fieldwork counts as physical activity on other days. Occasional running in cooler months.
  - Sleep: 7 to 8 hours. Bed 10 PM, up 5:30 AM. Sleeps deeply in the New Mexico quiet.

  ## Interests & Hobbies

  - Leatherwork: Hand-tooled belts, wallets, tooled journal covers, custom commissions. Each piece 20 to 80 hours depending on complexity.
  - Hiking and backcountry exploration: Organ Mountains and arroyos of southern Doña Ana County. Prefers solo hikes with Scout. Uses them for both recreation and informal ecological observation.
  - Wildlife photography: Nikon DSLR on fieldwork days. Roadrunners, javelinas, desert wildflowers. Growing Instagram portfolio (~2,400 followers).
  - Reading: Environmental science journals, Chicano speculative fiction, borderlands history. Currently rereading "The Water Knife" by Paolo Bacigalupi for the third time.
  - Stargazing: Identifies constellations in both Western and Mesoamerican astronomical traditions. Sometimes drives to remote spots to watch the sky.
  - Cooking comfort food: Tamales from his mom's recipe, pozole in winter, experiments with wild game and foraged desert ingredients.
  - Reality TV: Guilty pleasure. Watches competition shows with Marco on weeknights. Will not apologize.

  ## Home & Living

  - 2BR house in Las Cruces, NM. Small, older construction, affordable neighborhood. Ten minutes from the county government complex, five minutes from Carmen's house.
  - Second bedroom is the leatherwork studio. Worktable with magnifying lamp. Leather and tools sorted by type and project. Dyes and hardware in labeled bins.
  - Kitchen is functional but small. Big enough for pozole and tamale-making.
  - Small fenced yard for Scout. No garage. Car parked outside year-round. Windshield sunshade essential in summer.
  - Las Cruces summers reach 105 degrees Fahrenheit; cooling is a significant household expense.
  - Subaru Outback 2019. Essential for desert roads and field-site access. 87,000 miles.

  ## Devices & Services

  - MacBook Pro (personal). Used for data analysis, report writing, grant applications, and Etsy shop management.
  - iPhone 14. Primary device. Often in spotty cell coverage in desert fieldwork areas.
  - Nikon D7500 DSLR. Wildlife and landscape photography on fieldwork days.
  - Garmin handheld GPS. Fieldwork navigation and sample-site coordinates.
  - Crestline Consulting Workspace at `ian.salazar@dac-env.gov`. Gmail, Calendar, Contacts.
  - Spotify Premium.
  - Etsy shop "Salazar Leathercraft". Five to ten orders per month.
  - Subaru Outback (2019).

