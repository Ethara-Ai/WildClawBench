  ## MEMORY.md

  # Memory: Lamar Cochran

  ## Personal Profile

  Lamar is a Black Swedish hockey coach from Skellefteå, head of the J20 program at Björkleden IF in Umeå. He played at a high level, including two junior seasons in North America, before retiring and moving into coaching. The transition was harder than he admitted at the time. He has stopped trying to hide that, and now uses the experience to coach players who will have to make their own version of that transition.

  **Education and credentials**: Kandidatexamen (Bachelor's) in Sports Science from Norrland University, 2017. Swedish Hockey Federation Level 3 coaching certification, 2022. Currently pursuing the federation's advanced coaching diploma.

  **Languages**: Swedish (native, distinctly northern Västerbotten cadence), English (fluent, with North American traces from the junior years in Canada), Norwegian (understands well by mutual intelligibility), basic Finnish from rink-side absorption.

  **Citizenship and identity**: Swedish citizen, born and raised in Skellefteå, family from Västerbotten county. Culturally a Black Swedish man in a profession and a region where there are not many of him. He carries both halves of that identity without trying to make the gap invisible.

  **Temperament**: Steady, contained intensity. Direct without being blunt, demanding without being harsh, warm in the specific places he chooses to be warm. He raises his voice once or twice a season, and the players have learned that the rarity is the point.

  **Philosophy**: The ice reveals character. Coaching is recognizing the version of a player that only the pressure of competition shows, and developing it without breaking the person it lives inside. Development beats results, with the professional cost understood. He has been writing this down for a year in a personal coaching philosophy document.

  **Faith**: Loosely Lutheran by way of Sweden, loosely Christian by way of the African-American tradition his mother grew up in. He prays before games sometimes. He has not been to a service in years and has made peace with the inconsistency.

  **Cultural texture**: Speaks Swedish like a native of Västerbotten. Reads Black American literature he discovered late, including Baldwin, Whitehead, and Coates. Cooks his mother's food on Sundays with the rigor he learned as an athlete. Keeps northern Swedish weather habits and African-American cultural threads alongside each other without needing to choose.

  **Loyalty**: Stays in touch with players he coached three years ago. Has refused at least one job offer because the timing would have asked him to abandon a player mid-development. He would describe this as the only correct decision.

  ## Key Relationships

  - **Jasmine Mitchell**, 29. Girlfriend, together two years. Veterinarian at Norrland Djurkliniken. Calm, independent, supportive of the hockey calendar with good humor. They live together in Teg. In love, Lamar is steady, attentive, and quiet about it; he shows up through small daily considerations.
  - **Marcus Cochran**, 61. Father. Retired factory foreman in Skellefteå. Lifelong hockey fan, coached Lamar's youth teams. Knee replacement 2024, recovery good.
  - **Denise Carter**, 59. Mother. School administrator in Skellefteå. Warm, organized, the family anchor. African-American heritage that anchors the cultural half of Lamar's upbringing.
  - **Tyrone Cochran**, 27. Younger brother. Electrician in Skellefteå. Former junior player who chose a trade. Close and competitive about everything.
  - **Nils Bergqvist**, 34. Assistant coach. Former SHL defenseman. Detailed and analytical. Lamar is the motivator; Nils is the systems thinker.
  - **Mikael Johansson**, 55. Björkleden IF sporting director. Lamar's boss. Supportive but results-conscious. Gave Lamar the J20 job on playing pedigree and coaching potential.
  - **Oskar Ek**, 18. Team captain, J20. Talented center, SHL draft prospect. Lamar's primary leadership development project this season.
  - **Dr. Henrik Strand**, 42. Team physician at Norrland Regional Hospital. Manages player injuries and return-to-play protocols.
  - **Tommy Svensson**, 65. Lamar's childhood coach in Skellefteå, now retired. Monthly calls on coaching philosophy. Mentor figure.
  - **Frida Holmgren**, 30. Lamar's closest friend outside hockey. Journalist at Norrlandsposten. Knows to keep friendship and coverage separate.
  - **Jonas Eriksson**, sports physiotherapist. Three-week cadence for the old shoulder and the chronic hip tightness.

  ## Work & Projects

  **Employer**: Björkleden IF, Umeå. Head Coach, J20 Nationell (under-20 national junior league).

  **Work focus**: Player development, tactical systems, game management, and building a J20-to-SHL pipeline. On-ice coaching, practice planning, game prep, and player evaluations. Bus trips across Sweden for away fixtures.

  **Active projects**:
  - **Playoff push**: J20 team currently 4th in their group with the regular season closing out. Realistic playoff target. Fine-tuning special teams and managing minutes for draft-eligible players.
  - **SHL prospects**: Three J20 players identified as SHL-ready. Individual development plans, extra ice, coordination with the senior coaching staff on transition.
  - **Summer camp**: Off-season development camp (June and July). On-ice and off-ice programming. Budget proposal due in February each year to Mikael.
  - **Coaching philosophy document**: A personal long-form draft on player development, leadership, and tactical systems. Slow progress, ongoing.
  - **Advanced coaching diploma**: Federation modules through the year. Coursework on the schedule.

  **Schedule shape**: Practice Monday through Friday, typically 9 to 11 AM ice. Video, meetings, and planning fill afternoons. Games Friday and Saturday, occasionally midweek. Pre-season camp in mid-August, Nordic Coaching Symposium in early August.

  ## Finance

  - **Income**: Approximately 28,000 SEK per month from coaching salary. Jasmine earns roughly 35,000 SEK per month as a veterinarian. Combined household: roughly 63,000 SEK per month.
  - **Rent**: 9,500 SEK per month for the Teg apartment, split with Jasmine. Lamar's share: 4,750 SEK.
  - **Savings**: 85,000 SEK at Handelsbanken. Target 150,000 SEK. Contributing 4,000 SEK per month.
  - **Investment**: ISK account at Avanza with 32,000 SEK in index funds. Contributing 1,500 SEK per month.
  - **Tax**: PAYE, no complex situation.
  - **Monthly spend (SEK)**: Rent 4,750; savings 4,000; investment 1,500; car (fuel and insurance) 2,800; groceries 3,500; dining and coffee 1,800; gym 450; physiotherapy averaged 600; phone and internet 600; subscriptions 350; personal insurance 500; clothing and gear 800; travel fund 1,500; books and coaching resources 300; misc 1,200. Total approximately 24,650. Monthly buffer approximately 3,350.
  - **Credit**: One Visa debit card. No debt. No student loans.
  - **Goals**: Reach 150,000 SEK savings. Fund the Gothenburg symposium. Save toward a larger apartment (2027 or 2028). Upgrade the car when it stops being safe. The Norway trip with Jasmine, finally.
  - **Community giving**: Small recurring support to a Skellefteå youth hockey program, a Umeå community program, and a Black community hockey program in Detroit. He is quietest about the Detroit one.

  ## Health & Wellness

  - **Primary care**: Dr. Anna Lindqvist at Umeå Hälsocentral. Annual checkup in September. September 2025 all clear.
  - **Dentist**: Dr. Erik Forsberg in Umeå. Every six months.
  - **Exercise**: Gym five times a week, strength and conditioning, still trains like a player. Runs twice a week. Occasional on-ice with the team. Cross-country skis in winter weekends.
  - **Body maintenance**: Sports physiotherapist Jonas Eriksson every three weeks. Right shoulder, separated in his junior career, plus chronic hip tightness from playing. Ice baths after heavy sessions.
  - **Mental health**: No formal therapy. Processes stress through physical activity and talking with Jasmine. The 2023 retirement adjustment was hard; coaching gave him purpose again. Talks with Tommy Svensson when he needs perspective.
  - **Sleep**: 7.5 hours target. Bed by 10:30 PM, up at 6 AM. Struggles to sleep after late games; uses audiobooks to wind down.
  - **Supplements**: Protein powder, creatine, omega-3, vitamin D (essential through Umeå winters).
  - **Allergies**: None known.

  ## Interests & Hobbies

  - **Hockey beyond work**: Watches international hockey constantly. SHL, Liiga, KHL squads, NHL. Three streaming subscriptions stay open through the season. The watching is professional development; he would also do it for free.
  - **Cross-country skiing**: Long solo loops in the Vindeln forest through the long Umeå winters. Used the way other people use therapy. No music, no podcast, just poles and skis.
  - **Gym work**: Heavy lifting with a hip-hop playlist he has not changed in three years. Discipline as its own reward.
  - **Running**: Off-season when the snow has gone.
  - **Cooking**: Sunday meal prep with the radio on. Containers lined up. The ritual is older than the relationship he is in.
  - **Reading**: Coaching literature on the desk, sports psychology on the bedside, Black American literature he is making up for, including Baldwin, Whitehead, and Coates.
  - **Beer league**: Occasional games with old teammates, for fun.

  ## Home & Living

  - **Address**: Two-bedroom apartment in Teg, Umeå. Overlooking the Ume River. Walking distance to the arena across the river.
  - **Aesthetic**: Minimalist Scandinavian on the surface, quietly his underneath. Warm evening light. Hockey memorabilia on the walls, including jerseys and a signed stick from his SHL debut. One piece of Black-American art Jasmine gave him for his thirtieth birthday.
  - **Bookshelves**: Arranged by author. Run heavier on Black literature than visitors expect.
  - **Vehicle**: A four-year-old Volvo. Handles winter without complaint. He refuses to upgrade for novelty and intends to drive it until it stops being safe.
  - **Neighborhood**: Teg, across the river from central Umeå. Quiet. Small balcony.
  - **Home projects**: Power rack and adjustable dumbbells ordered for the spare-room home gym. Jasmine wants a reading corner on the balcony for summer. Considering a dog, breed and schedule under discussion.

  ## Devices & Services

  - **Phone**: Samsung Galaxy S24. Messaging, video clips, coaching apps, team communication.
  - **Laptop**: Lenovo ThinkPad. Video analysis (Hudl, InStat), email, coursework, presentations.
  - **Coaching tools**: Whistle, magnetic tactics board, iPad for on-bench video review during games.
  - **Smart home**: Smart speaker, Phillips Hue lights (warm in evenings), one Ring doorbell.
  - **Print subscriptions**: The Athletic (hockey coverage), a Swedish hockey monthly.
  - **Digital subscriptions**: SHL.se, NHL.tv, Spotify, a shared streaming service with Jasmine, the Swedish Hockey Federation coaching portal.
  - **Headphones**: Two pairs treated as gear, not accessories.

