  ## Preferences

  - **Food regulars**: Norrvik Bar & Grill (game-night dinners with the staff), Rost Kaffebar (fika), Strandkrogen (date nights with Jasmine), Umeå Kulturhus café (casual lunches).
  - **Food at home**: High-protein, performance-oriented through the week. Sunday meal prep. Comfort food from his mother's tradition, including jerk chicken with rice and peas, blackened catfish, shrimp and grits, cornbread, sweet potato pie, and mac and cheese for celebrations. Jasmine is the better cook on weekends.
  - **Coffee**: Filter, strong, four cups daily. First at 6 AM, last by 2 PM. Fika is non-negotiable.
  - **Alcohol**: Light beer after wins. Moderate otherwise. None during playoff game weeks.
  - **Music**: Hip-hop (Kendrick Lamar, J. Cole), classic rock for pre-game (Led Zeppelin, AC/DC), electronic for lifts, R&B for quiet evenings. The gym playlist has not changed in three years.
  - **Podcasts**: *Rinksidorna*, *Ice Talk*, *Morgonekot*, *Coaching Edge*. Listens during gym sessions.
  - **Reading**: Hockey literature (Charlesworth, Gretzky), Black American fiction (Baldwin, Whitehead), sports psychology (Dweck's *Mindset*). Reads on the team bus.
  - **News**: *Sportbladet*, *The Athletic*, *Norrlandsposten*. Checks SHL and J20 standings daily.
  - **Style**: Athletic Scandinavian with American undertone. Fitted dark sweaters, well-cut jeans, leather sneakers, one black wool overcoat. One conservatively cut suit for league functions and weddings. A vintage NHL jersey, a Carhartt jacket from a Detroit cousin, and two pairs of headphones as gear.
  - **Gifts**: Practical, considered, slightly under-budgeted. Quality coaching gear for an old teammate. A book he has read for his brother. A specific cookbook for his mother. A travel voucher for Jasmine toward Norway. He is bad at flowers and has stopped pretending otherwise.
  - **Aesthetic dislikes**: Coaches who win by intimidation. Parents treating junior hockey as their own second career. Sportswriters mistaking hot takes for analysis. Loud post-game restaurants. Casual homophobia or racism in hockey culture, which he refuses to perpetuate.
  - **Travel preferences**: Driving over flying when possible. The control, and the long drives with Jasmine or Tyrone, which are the closest thing he has to therapy.
  - **Sensory anchors**: Skates on fresh ice. Cold dry air over snow. Espresso. The cedar-and-paper smell of his bookshelf. The smoothness of a broken-in stick blade. He almost always has something on at low volume at home. True silence makes him uneasy, except in the forest in winter where silence is the point.

