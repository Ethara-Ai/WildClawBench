  ## MEMORY.md

  # Memory: Lee James Stark

  ## Personal Profile

  Lee grew up on the rural edge of Bozeman, in a house his maternal grandmother built. His mother Carol is a retired schoolteacher with deep Montana roots. His father Harold immigrated from Tromsø, Norway in the 1980s, worked as a carpenter, and returned to Norway after the divorce when Lee was 14. They have rebuilt their relationship in adulthood and now talk every Sunday.

  He is a layered American: Montana on his mother's side, Norwegian on his father's. His maternal grandmother's folk remedies and his Norwegian grandmother's folkemedisin shaped him in equal measure, and he has built a herbal practice that draws on both without trying to flatten the threads.

  He is a Certified Professional Midwife trained at the Bridgewater Institute for Midwifery Studies (2015) and a clinical herbalist credentialed by the Northern Rockies School of Botanical Arts (2018). He uses pharmaceutical medicine when it is the right tool. He just refuses to grant institutional medicine unquestioned authority, and he has thought carefully about where his skepticism is warranted and where it is not.

  He speaks English with a flat Western American cadence and slips into Norwegian when his father is in town or when the Sunday call runs long. His listening Norwegian is stronger than his speaking. He intends to close the gap and has not yet.

  He is stubborn under the easygoing surface, emotionally generous to a fault, and bad at extending the same vulnerability inward that he facilitates in clients. He cries privately and rarely. He thinks of the garden, the trail, and the birth room as sacred spaces. He does not call this religion. He does not need to.

  He believes birth is a sacred threshold that institutional medicine has too often stripped of its power, and that a midwife restores that power without sacrificing the safety the institutional system can provide. He believes the earth is a relative, not a resource. He would tell Owen, when he is older, that the people who change anything are usually the ones who learned to do the unglamorous work well.

  ## Key Relationships
  - **Megan Caldwell** (partner, 38). Carpenter and furniture maker; runs Caldwell Woodcraft. Not legally married; together about 10 years. She built the barn studio. Steady, patient, the quiet counterbalance. Communicates through small reliable actions and has learned to ask Lee for words.
  - **Owen Stark** (son, 7). First grader at Gallatin Valley Montessori. Loves bugs, drawing, and following Lee around the garden. Beginning to help with herb harvesting.
  - **Nora Stark** (daughter, 4). Pre-K at the same Montessori. Wild energy, mud and trucks. Mild egg allergy; egg-free backups always on hand.
  - **Carol Stark** (mother, 64). Retired teacher in Belgrade. Watches the kids two to three days a week. Opinionated, deeply loving. She and Lee clash about his "hippie choices" but the bond is iron.
  - **Harold Stark** (father, 68). Tromsø, Norway. Visits Bozeman in spring and fall. Sends dried fish, flatbread, and Ingrid's herbal preparations. Sunday video call at 10:00 AM Mountain Time.
  - **Brett Dunning** (apprentice midwife, 28). Started apprenticing in September 2025; targeting his own CPM certification in 2027. Talented, sometimes rushes. Lee is invested and protective.
  - **Kyle Hennessey** (best friend, 35). Doula and lactation consultant in West Bozeman. Constant cross-referrals. Saturday morning trail-run partner.
  - **Donna Whitfield** (co-op co-manager, 42). Manages the business side of Cottonwood Basin Organic Co-op. Spreadsheets and logistics to Lee's soil and crops. Trusted gate on co-op spending at or above $100.
  - **Dr. Nathan Gale** (collaborating physician, 50). OB-GYN at Bridger Valley Family Health. Provides backup for Lee's home-birth clients. Mutual respect across different philosophies.
  - **Uncle Walt Stark** (maternal uncle, 71). Lives up on the ridge. Taught Lee banjo, foraging, and reading weather. Early-stage COPD; declining. Lee sends a small monthly amount toward his medical expenses.
  - **Ingrid Stark** (paternal grandmother, 89). Tromsø with Harold. Source of Norwegian folkemedisin in Lee's practice. Communicates through Harold; does not use phones.
  - **Tom Gunderson** (market friend, 45). Smoked-meat stand at Main Street Market. Trades tinctures for brisket. Good gossip partner.

  ## Work & Projects
  - **Bridger Root Midwifery**: Home-birth practice run from the converted barn studio. 4 to 6 active clients at a time, each with about 10 prenatal visits plus birth and postpartum follow-ups. Currently 4 active. Sliding-scale income roughly $3,200/month. Liability insurance due the 15th.
  - **Northern Remedy Co.**: Tinctures, salves, teas, and seasonal blends. Sells at Main Street Saturday Market, Midtown Sunday Market (alternating), and the periodic Gallatin Makers Fair (roughly four to six dates a year). Online shop at northernremedyco.com via WooCommerce; Etsy carries a smaller, ship-friendly subset. Roughly $800 to $1,200/month.
  - **Cottonwood Basin Organic Co-op**: Co-manager with Donna Whitfield. 14 member families, two seasonal hires via Gusto. Lee handles growing, planting rotation, and equipment days; Donna handles finance and logistics.
  - **Apprentice training**: Brett shadows Lee at prenatal visits and births with growing independence. Quarterly formal skills assessments. Target CPM certification 2027.
  - **Long arcs**: Six-week Norway trip with the kids planned for a future summer; barn studio expansion to add a small retail space for Northern Remedy Co. (preliminary estimates in hand from Megan); Owen's schooling decisions past second grade.

  ## Finance
  - **Monthly income, household, approximate**: midwifery $3,200 (variable, sliding scale); Northern Remedy Co. $800 to $1,200; Megan's woodworking $2,800; household total roughly $6,800 to $7,200.
  - **Monthly expenses, approximate**: mortgage $1,350; Montessori tuition $1,100; health insurance (marketplace) $620; groceries (supplemented by garden and co-op) $450; vehicle payment $280 plus gas; herbal supplies and packaging $300; utilities $190; midwifery liability insurance $180; massage $90; co-op dues $40 annual (paid in one lump each spring); savings and miscellaneous roughly $400 to $600.
  - **Position**: No significant debt beyond the mortgage. Emergency fund thin at roughly $2,500. Saving toward Owen's eventual schooling and the barn expansion.
  - **Style**: Lee and Megan talk about money openly with each other, rarely with anyone else. He shops local-first, pays full price for daily tools and proper boots, and refuses full price for almost anything else.
  - **Quiet giving**: Small monthly support to Uncle Walt for medical expenses; recurring donations to a watershed protection group, the local arts center, and a community birth-equity fund.

  ## Health & Wellness
  - Generally excellent health. Walks the walk on the herbalism.
  - Daily tinctures: ashwagandha for stress, rhodiola for energy, elderberry in winter.
  - Chronic right-shoulder tension from years of catching babies in awkward positions. Massage with Craig Ellison every other Thursday at 2:00 PM.
  - Annual wellness check with Dr. Kevin Holbrook at Gallatin Mountain Family Practice. No current medications.
  - Runs 15 to 20 miles per week on Bridger Mountain trails. Breathwork and a small grounding ritual before each birth.
  - Postpartum hemorrhage during Nora's birth in 2022 left a permanent imprint on how he holds risk in his work.
  - Dietary frame: mostly plant-based, eats eggs from their own chickens and occasional locally sourced meat. Drinks yerba mate, not coffee. Avoids processed sugar and most dairy. Daily fermented foods (kraut, kimchi, kombucha). Nora's egg allergy is a hard household constraint.

  ## Interests & Hobbies
  - **Wildcrafting** in the Gallatin Range. The practice that anchors his herbal business and his unscheduled hours both. Closer to prayer than to work.
  - **Gardening**: half-acre kitchen garden, medicinal herb beds, small orchard (apple, pear, chokecherry), eight hens, three-bin compost system. Strong opinions on cover crops.
  - **Clawhammer banjo** learned from Uncle Walt, refined for nearly twenty years. Sits in with The Bridger Ramblers occasionally; refuses monetized gigs.
  - **Trail running** three to four times a week at dawn on Bridger Mountain loops he has been running for years.
  - **Pottery**: hand-building class on Wednesday evenings at Bridger Creek Arts Center. Functional work, mugs and herb-drying trays.
  - **Reading**: ethnobotany, birth narratives, Western literary fiction (Clementine Barrow). Subscribes to The Herbalist's Quarterly and Midwifery Today. On a third pass through the Foxfire series.

  ## Home & Living
  - **Property**: three-acre homestead in the hills east of Bozeman. 1940s farmhouse (3 bed, 1.5 bath) slowly renovated by Megan. Converted barn serves as the midwifery studio and herbal workshop.
  - **Garden and yard**: half-acre kitchen garden, medicinal herb beds, small orchard, chicken coop with eight hens, three-bin compost.
  - **Vehicle**: shared 2017 Toyota Tacoma, the "Farm Truck." Birth bags, market supplies, and muddy boots live in the back.
  - **Atmosphere**: warm, cluttered-in-a-good-way. Dried herbs from the kitchen ceiling. Mason jars everywhere. Megan's handmade furniture throughout. Kids' art on every surface. Smells like lavender and woodsmoke.

