  ## MEMORY.md

  # Memory: Margaret Farmer

  ## Personal Profile

  American by birth, Japanese by formation. Born in Portland, Oregon. Moved to Kyoto at age 10 with her parents, schooled in Japanese from that point. Rooting career and life in Japan was gradual, not declared; the identity feels accumulated rather than chosen.

  Education: B.A. in Fine Arts (Ceramics), Kyoto Geijutsu University, 2017. Two-year apprenticeship under Toshio Saito at Shigaraki, 2017-2019.

  Languages: English (native), Japanese (near-native, slight foreign-resident accent), basic French from gallery dealings. Japanese for local gallery work; English with parents, Ethan, and international galleries. Code-switching is unremarkable.

  Personality: patient, deliberate, quietly stubborn. Clay does not respond to urgency; patience has become the texture of her personality. Strangers read her as quiet; collaborators read concentration. Listens before speaking; no longer obligated to fill silence.

  A quiet stubbornness under the calm surprises people who underestimate her. She makes the work she wants to make. Has refused Tokyo offers conflicting with her Shibui commitment, stayed at the craft collective rather than building a more visible studio elsewhere. The career is the evidence.

  Carries low-grade money anxiety since the apprenticeship years. Studio life is feast-or-famine; commissions pay slowly. Manages with disciplined budgeting learned from her mother. The household runs tighter than her gallery reputation suggests.

  Cultural identity: not quite Japanese to long-time Kyoto residents, not quite American to family in Portland. Has made peace; no longer tries to bridge the gap.

  Religion: loosely Christian upbringing, ethics retained without observance. Visits temples without praying, joins seasonal festivals without theological investment. The closest she has to a sacred practice is the studio at first light.

  Philosophy: process is the point; materials have memory; tradition is a living practice, not a museum piece. Honouring her teacher means making her own work rather than copying his. Tells younger potters that kiln logs, glaze tests, and quiet years are the real training, and that being underestimated by people who do not know craft is sometimes useful.

  ## Key Relationships

  - **Ethan Caldwell**, age 33. Partner of 3 years. Landscape architect at Midori Design Office, Kyoto. Quiet, nature-oriented, supportive. Reads landscapes as she reads materials. Live separately by choice, spend most weekends together; discussed changing the arrangement and have not.
  - **Carol Farmer**, age 59. Mother. Retired gardening instructor. Lives in the family home in Kitayama. Calls every Wednesday evening. Supportive but quietly anxious about an artist's finances. Taught Margaret financial discipline.
  - **Robert Farmer**, age 63. Father. Retired civil engineer. Lives with Carol in Kitayama. Practical, reserved. Built the shelving in Margaret's first studio. Communicates through shared projects more than words.
  - **Daniel Farmer**, age 28. Younger brother. Graphic designer at Kaze Creative, Osaka. Close with Margaret, visits monthly. Designs her exhibition materials, business cards, and portfolio site.
  - **Toshio Saito**, age 72. Former master and teacher at Shigaraki. Retired from active production, still fires occasionally. Margaret visits twice a year. Foundational influence. On his birthdays she makes a single small piece; the slow accumulation has become her most personal gift.
  - **Mika Tanabe**, age 35. Fellow potter at the Higashiyama Craft Collective. Shares kiln access. Close friend and studio neighbour. Coordinates firing schedules; occasional collaboration on group exhibitions.
  - **Akiko Watanabe**, age 48. Gallery director at Shibui Gallery, Kyoto. Primary gallery relationship of 3 years. Professional and reliable.
  - **Jean-Luc Moreau**, age 52. Gallery owner at Galerie Terre, Paris. Represents Margaret in Europe since 2024. Communicates in English and French.
  - **Tomomi Ishida**, age 40. Ceramics curator at the Kyoto Craft Museum. Has included Margaret in two group exhibitions. Driving the December 2026 commission.
  - **Riku Hasegawa**, age 29. Freelance photographer documenting her work and exhibitions. Reliable; photographs ceramics in natural light.

  ## Work & Projects

  - **Studio**: Independent studio at the Higashiyama Craft Collective, a shared facility with 4 potters. Individual spaces of about 25 sqm, communal gas reduction kiln, seasonal anagama wood-fire kiln used twice yearly.
  - **Practice**: Wheel-thrown and hand-built vessels. Functional ware (bowls, cups, plates, vases) with occasional sculptural work. Known for wood-ash glazes and natural textures. Influenced by the Shigaraki and Arts and Crafts traditions.
  - **Active projects**:
    - **"Seasonal Table" Solo Exhibition** at Shibui Gallery, Kyoto. Opens October 10, 2026. 30-piece functional tableware collection reflecting four seasons. In production.
    - **Galerie Terre Group Show** in Paris. Opens October 17, 2026. 8 pieces required. Theme: "Earth and Hand." Jean-Luc coordinates five international potters.
    - **Kyoto Craft Museum Commission**. Three large vessels for the museum's permanent collection. Due December 2026. Prestige; prototypes underway.
    - **New ash glaze series**. Wood-ash glaze line using local Kyoto mountain ash. Ongoing.
  - **Sales channels**: Shibui Gallery (40% commission), Galerie Terre (50%), spring/autumn open studios, occasional online orders via the portfolio site.
  - **Schedule frame**: Studio 6 days/week, Sundays usually off. Firing weeks are 3-5 day cycles with continuous kiln monitoring.
  - **Kiln log**: kept since apprenticeship years. Every firing, every glaze test, every result. Closest thing she has to an autobiography of her practice. Considered whether it could become a book; in no hurry to decide.

  ## Finance

  - **Annual income**: approx JPY 4,800,000 (about USD 31,000), variable month to month. Gallery sales, commissions, direct sales, occasional teaching workshops.
  - **Studio rent**: JPY 65,000/month (Higashiyama Craft Collective).
  - **Apartment rent**: JPY 85,000/month (Higashiyama 1-bedroom).
  - **Savings**: JPY 2,800,000 in savings. Target JPY 4,000,000. Contributing JPY 40,000/month when income allows.
  - **Monthly budget**: studio rent 65,000, apartment rent 85,000, materials (clay, glazes, fuel) 55,000, groceries 40,000, dining and coffee 25,000, transport 12,000, yoga 8,000, phone and internet 8,000, physiotherapy 6,000, subscriptions 3,000, misc 20,000. Total approx JPY 327,000. Buffer approx JPY 73,000.
  - **Tax**: Files as sole proprietor. Accountant handles annual filing. Quarterly estimated payments.
  - **Goals**: Build savings to JPY 4M, invest in a personal kiln within 3 years, explore teaching as supplementary income.
  - **Giving**: Small amounts to parents on specific occasions. A young-potter mentorship fund, a small Kyoto cultural-preservation organisation, and an arts-education programme Toshio founded. Treats it as overhead.

  ## Health & Wellness

  - **Primary care**: Dr. Kenji Nakamura at Higashiyama Clinic. Annual check-up in February; last February 2026, all clear.
  - **Dentist**: Dr. Emi Harada at Gion Dental Office. Every 6 months.
  - **Physiotherapy**: Dr. Aiko Fujimoto at Kyoto Body Works. Monthly. Shoulder and wrist maintenance for wheel-work strain.
  - **Exercise**: Morning walks daily, 30 minutes through Higashiyama temple paths. Yoga 2x/week (Tuesday, Saturday) at Lotus Studio, Okazaki. Occasional weekend hiking in the Kitayama mountains with Ethan.
  - **Sleep**: 7.5 hours target. Bed by 10:30 PM, up at 6:00 AM. Reads before sleep.
  - **Mental health**: No formal therapy. The studio is meditative. Journals intermittently. Ethan and Mika are primary emotional support.
  - **Supplements**: Calcium (bone health, doctor-recommended), vitamin D in winter.
  - **Allergies and restrictions**: Mild shellfish sensitivity. Avoids shrimp and crab.

  ## Interests & Hobbies

  - Ceramics is no longer a hobby. Studio time, ceramics reading, and a decade of kiln logs are all the work.
  - Walking: daily discipline. Temple-path loop through Higashiyama in early morning, before tourists arrive. Partly meditation, partly restoring her own scale after long studio stretches.
  - Reading: ceramics journals on the work desk, Soetsu Yanagi on the bedside table (same book two years, in no hurry to finish), essays on craft philosophy, occasional literary fiction.
  - Hiking with Ethan in the Kitayama mountains on weekends. Not particularly athletic. Hikes for being above the city and long conversations that happen when two people walk side by side rather than across a table.
  - Journaling: through the kiln log.

  ## Home & Living

  - **Apartment**: 1-bedroom on the ground floor of a traditional machiya-style building in Higashiyama. Tatami room, small kitchen, garden view. Quiet neighbourhood near temples. Small, ordered, intentional. Walls mostly bare; the garden through the kitchen window is the room's decoration.
  - **Objects on display at home**: pieces by potter friends she trades with, plus one piece by Toshio Saito kept since apprenticeship.
  - **Studio**: about 25 sqm at the Higashiyama Craft Collective. Electric wheel, work tables, glaze lab, bisque shelving. Shared access to the collective's gas reduction kiln and seasonal anagama. Slightly chaotic in the organised way of someone working in one space for years. Shelves labelled, glaze materials by colour.
  - **Vehicles**: bicycle for Higashiyama runs. No car, never wanted one. Walks when the bike will not fit.
  - **Family home**: parents in Kitayama, northern Kyoto.

  ## Devices & Services

  - **Phone**: iPhone 15. LINE, email, daily studio photos, work-in-progress photography, reference images.
  - **Laptop**: MacBook Air M2. Invoicing, portfolio website edits, email, gallery communications.
  - **Camera**: relies on Riku Hasegawa for professional documentation.
  - **Long-held tools**: same electric wheel since undergraduate years (refused to replace); same kitchen knives since the apprenticeship.
  - **Smart home**: none. No Ring, no smart speakers, no IoT devices.
  - **Subscriptions**: one streaming service, Spotify, Ceramics Monthly (digital), The New York Times (digital).

