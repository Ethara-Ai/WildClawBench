schema_version = "1.1"

[task]
name = "amanda_hayes_01"
description = "It's the start of October and I'm finally sitting down to figure out where September's money went, because what's left in checking isn't matching the picture in my head. I dumped everything I had into this folder along with my Chase Freedom card statement. Some of what I bought I paid cash for and some ran through the debit side, so pull my checking activity, and I left myself some notes about which of those charges were shared or need to be expensed so check those too, because no single source has all of it. My September budget targets aren't in this folder — I keep them on Google Drive in a file called `September_Budget_Notes.md` (file id `file-sept-budget`). Pull that file via the Google Drive API and use those numbers exactly for the variance analysis, since they're newer than the older `budget_tracker_2026.csv` if you see it. I want an honest read on what I really spent in each of my usual budget categories last month versus what I'd set for myself and how far over I ended up, and since I've been keeping a running tally of my monthly spending all year tell me whether September came in above or below where I've been averaging. Put the write-up in report.md with the category actuals, the purchases you matched, and the total I went over, and drop anything that shouldn't count into flagged_items.csv with a quick reason for each. Don't move money around or message anyone about this, it stays with me."
