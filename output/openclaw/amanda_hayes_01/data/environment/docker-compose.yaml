services:
  main:
    build:
      context: .
    image: harbor-main:local
    command: ["sleep", "infinity"]
    depends_on:
      google-analytics-api:
        condition: service_healthy
      google-calendar-api:
        condition: service_healthy
      google-classroom-api:
        condition: service_healthy
      google-drive-api:
        condition: service_healthy
      google-maps-api:
        condition: service_healthy
      linear-api:
        condition: service_healthy
      notion-api:
        condition: service_healthy
      plaid-api:
        condition: service_healthy
      quickbooks-api:
        condition: service_healthy
      trello-api:
        condition: service_healthy
  google-analytics-api:
    build:
      context: ./google-analytics-api
    image: harbor-google-analytics-api:local
    expose:
      - "8068"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8068/health',timeout=3).status<400 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256Mi
