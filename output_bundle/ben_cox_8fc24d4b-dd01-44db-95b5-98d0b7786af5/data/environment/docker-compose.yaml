services:
  main:
    build:
      context: .
    image: harbor-main:local
    command: ["sleep", "infinity"]
    depends_on:
      airtable-api:
        condition: service_healthy
      docusign-api:
        condition: service_healthy
      gmail-api:
        condition: service_healthy
      outlook-api:
        condition: service_healthy
      quickbooks-api:
        condition: service_healthy
      xero-api:
        condition: service_healthy
  airtable-api:
    build:
      context: ./airtable-api
    image: harbor-airtable-api:local
    expose:
      - "8032"
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - python3 -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8032/health',timeout=3).status<400 else 1)"
      interval: 5s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 256Mi
  docusign-api:
    build:
      context: ./docusign-api
